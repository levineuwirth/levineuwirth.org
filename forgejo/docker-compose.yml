# Forgejo deployment for git.levineuwirth.org.
#
# Lives at /root/forgejo-server/docker-compose.yml on the VPS; this copy is
# the tracked source, in the same spirit as nginx/ and systemd/. Until
# August 2026 it existed only on that box, which meant the sole description
# of how the forge was deployed was inside its own backup tarball.
#
#   scp forgejo/docker-compose.yml root@<vps>:/root/forgejo-server/
#   ssh root@<vps> "cd /root/forgejo-server && docker compose up -d"
#
# Environment variables of the form FORGEJO__section__KEY are applied to
# /data/gitea/conf/app.ini by the entrypoint at startup. They take effect on
# container *recreation*, not on restart — `docker compose up -d` after an
# edit here, not `docker restart forgejo`.
#
# Notes on specific settings:
#
#   DOMAIN / SSH_DOMAIN / ROOT_URL — these read git.yourdomain.com until
#   2026-08-11. nginx proxied around the mistake so the site worked, but
#   Forgejo generates clone URLs, redirects, and mail links from ROOT_URL,
#   so all of those were wrong.
#
#   SSH_PORT 2222 — published on 0.0.0.0 and open on the host, but filtered
#   by many public networks (it is unreachable from at least one Copenhagen
#   library). Clone over HTTPS; treat SSH as the convenience path, not the
#   dependable one.
#
#   3000 is bound to 127.0.0.1 deliberately: the web UI is reachable only
#   through the host's nginx, never directly.
#
# The database is SQLite at forgejo-data/gitea/gitea.db. Backups are
# systemd/forgejo-backup.{service,timer} driving tools/forgejo-backup.sh.
#
#   VERSION — the floating `:15` tag: the 15.0 LTS line (supported to
#   2027-07-15), upgraded from 1.21.11-0 on 2026-10-01 by forgejo/UPGRADE.md.
#   systemd/forgejo-update.timer applies each new 15.0.x patch unattended
#   (backup first, rollback and hold if it does not come up), so this file
#   names the line, not the patch; `curl -s https://git.levineuwirth.org/api/v1/version`
#   names the patch, and the unit's journal records every change. The move
#   to the next LTS, 19.0, is due in spring 2027 and is a manual run
#   (UPGRADE.md § 7.4): change this tag as part of it, not before.
#
#   CLI — inside the container, call it `gitea`, never `forgejo`. The image's
#   wrapper takes its own path from the name it was invoked by, so `forgejo
#   admin regenerate keys` writes key lines that 14.0 and later refuse to
#   start on, and `forgejo doctor` reports correct keys and hooks as stale
#   (UPGRADE.md § 1.5).

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__DOMAIN: git.levineuwirth.org
      FORGEJO__server__SSH_DOMAIN: git.levineuwirth.org
      FORGEJO__server__ROOT_URL: https://git.levineuwirth.org/
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__NO_REPLY_ADDRESS: noreply.git.levineuwirth.org
      FORGEJO__actions__ENABLED: "false"
      # No zip/tar.gz/bundle downloads: crawlers fetched them commit by commit
      # and left 2,464 jobs queued (UPGRADE.md § 1.3). Clone instead. This 404s
      # the web routes only; the forge vhost's nginx 404s the API route,
      # /api/v1/repos/*/*/archive/, which 15.0 still serves with this set.
      FORGEJO__repository__DISABLE_DOWNLOAD_SOURCE_ARCHIVES: "true"
      # nginx reaches 127.0.0.1:3000 through Docker, so its requests arrive
      # from proxy-net's gateway; the 1.21 app.ini trusted "*".
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: "127.0.0.0/8,::1/128,172.18.0.1/32"
      FORGEJO__security__REVERSE_PROXY_LIMIT: "1"
      # 15.0 renames session cookies; keep the old name so the hop logs nobody out.
      FORGEJO__security__COOKIE_REMEMBER_NAME: "gitea_incredible"
    volumes:
      - ./forgejo-data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2222:22"
      - "127.0.0.1:3000:3000" # Exposes web UI only to the local Nginx server
    networks:
      - proxy-net
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0

networks:
  proxy-net:
    external: true
