# Ordered rules. Only robots.txt is readable before the Meta denial.
# Identifying strings are claims, not identities; disguised web clients
# reach the final proof-of-work challenge rather than a default ALLOW.
bots:
  - name: robots
    action: ALLOW
    expression: 'method in ["GET", "HEAD"] && path == "/robots.txt"'

  - name: deny-meta
    user_agent_regex: '(?i:meta-externalagent|meta-externalfetcher|facebookexternalhit|facebookcatalog|facebot|facebookbot|meta-webindexer)'
    action: DENY

  # Both the declared user agent AND an upstream-published address must
  # match. nginx overwrites the client address; public headers cannot spoof it.
  # Avoid _allow-good.yaml: it also admits other crawlers, including Common Crawl.
  - import: (data)/crawlers/googlebot.yaml
  - import: (data)/crawlers/bingbot.yaml

  # Git's smart protocol, including the initial unauthenticated request
  # which Forgejo can answer with 401 before Git supplies credentials.
  - name: git-discovery
    action: ALLOW
    expression: >-
      method == "GET" && path.matches("^/[^/]+/[^/]+/info/refs$") &&
      "service" in query && query["service"] in ["git-upload-pack", "git-receive-pack"]
  - name: git-transfer
    action: ALLOW
    expression: >-
      method == "POST" && "Content-Type" in headers &&
      ((path.matches("^/[^/]+/[^/]+/git-upload-pack$") &&
        headers["Content-Type"] == "application/x-git-upload-pack-request") ||
       (path.matches("^/[^/]+/[^/]+/git-receive-pack$") &&
        headers["Content-Type"] == "application/x-git-receive-pack-request"))

  # Forgejo validates the token before serving its API. Merely adding a
  # bad token must return 401; the integration rehearsal checks that.
  - name: token-api
    action: ALLOW
    expression: >-
      path.startsWith("/api/v1/") && "Authorization" in headers &&
      headers["Authorization"].matches("^(token|Bearer) [^ ]+$")

  - name: static-and-feeds
    action: ALLOW
    expression: >-
      method in ["GET", "HEAD"] &&
      (path == "/favicon.ico" ||
       path.startsWith("/assets/") || path.startsWith("/avatars/") ||
       path.matches("^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)?[.](rss|atom)$"))

  - name: challenge-web
    path_regex: '.*'
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 2

dnsbl: false
honeypot:
  enabled: false
openGraph:
  enabled: false
status_codes:
  # Browsers still solve the challenge; tools must not mistake its HTML
  # for a successful API response or download. Use curl --fail in scripts.
  CHALLENGE: 403
  DENY: 403
store:
  backend: bbolt
  parameters:
    path: /state/anubis.bdb
