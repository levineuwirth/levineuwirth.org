; local.d/10-livesync.ini — overrides for Obsidian's Self-hosted LiveSync
; plugin, mounted read-write by couchdb/docker-compose.yml (see that file's
; comment on why :ro breaks the entrypoint). These are the settings the
; plugin's own "Issue detection" self-check calls for: CORS so the app
; (not a browser page on this origin) can call the API, a WWW-Authenticate
; header, a request-size ceiling generous enough for a large bulk push, and
; a document-size ceiling wide enough for a note plus its embedded
; attachments without being unbounded.
;
; require_valid_user is set in BOTH [chttpd] and [chttpd_auth] because they
; gate different request paths (plain HTTP vs the auth layer); CouchDB's
; own docs list both, and leaving either at its default false reopens the
; "admin party" — anonymous requests treated as admin — the moment this
; file is missing one line.
;
; enable_cors and WWW-Authenticate live under [httpd], not [chttpd], even
; though chttpd is what actually serves 5984 — legacy CouchDB config
; naming, confirmed against the plugin's own checker (2026-09-22): setting
; enable_cors under [chttpd] is silently accepted but has no effect.
;
; cors.origins is a bare `*`, not an explicit list of the plugin's known
; origins (app://obsidian.md, capacitor://localhost, ...). Two reasons:
; CouchDB does not trim whitespace in a comma-separated origins list, so
; `a, b` silently fails to match `b` (confirmed the hard way — this broke
; capacitor://localhost, the iOS app's origin, while the desktop origin
; happened to match first and masked it); and CouchDB's CORS
; implementation reflects the actual request Origin per-request even when
; origins is `*`, so it stays compatible with credentials = true rather
; than sending a literal wildcard header.

[couchdb]
max_document_size = 50000000

[httpd]
enable_cors = true
WWW-Authenticate = Basic realm="couchdb"

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[cors]
origins = *
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
