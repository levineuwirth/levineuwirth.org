# Site-owned migration policy, not an engine default.
#
# Every file Git sees has one owner: tests/engine-paths.txt (the engine),
# site-files, or vendored-files. An entry ending in / covers a directory; an
# engine path inside a site directory stays the engine's. Files that will move
# as they are belong to the engine even when they carry identity, which the
# frozen allowances then record. The site keeps its prose (README, design
# docs, licenses, THIRD-PARTY), ops, content tests, baselines and identity
# overrides; the engine writes its own documents and notices at extraction
# (A10, Q3). Vendored files are third-party, unscanned, and move with the
# engine; downloaded ones need not be present.
#
# fixed-strings match case-insensitively, as the identity from `site config`
# does. fixed-patterns are case-sensitive regular expressions for the ln
# namespace, renamed in A9; they catch new names in it as well as old ones.
fixed-strings:
- LN Sans                                    # Fira's rename; fonts.yaml in A6e
- 619844703EC398E70B0045D7150F08179CFEEFE3   # the signing subkey's keygrip
fixed-patterns:
- '\bln[A-Z]\w*'          # lnUtils, window.lnEnhance, dataset.lnEnhanced
- '\bln:[\w-]+'           # ln:content-added
- '\bdata-ln-[\w-]+'
- '--ln-[\w-]+'
