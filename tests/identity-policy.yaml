# Site-owned migration policy, not an engine default.
#
# Every file Git sees has one owner. The engine owns what is under engine/,
# named by its path there; files that moved as they are carry identity, which
# the frozen allowances record. The site owns the rest: each file is named in
# site-files, or is inside a directory named there (an entry ending in /). The
# site keeps its prose (README, design docs, licenses, THIRD-PARTY), ops,
# content tests, baselines and identity overrides; the engine writes its own
# documents and notices at extraction (A10, Q3). vendored-files are the
# engine's third-party code, by its path in the engine: unscanned, and need
# not be present when they are downloaded.
#
# fixed-strings match case-insensitively, as the identity from `site config`
# and the font names from tools/fonts.yaml do. fixed-patterns are
# case-sensitive regular expressions for the ln namespace, renamed in A9;
# they catch new names in it as well as old ones.
fixed-strings:
- 619844703EC398E70B0045D7150F08179CFEEFE3   # the signing subkey's keygrip
fixed-patterns:
- '\bln[A-Z]\w*'          # lnUtils, window.lnEnhance, dataset.lnEnhanced
- '\bln:[\w-]+'           # ln:content-added
- '\bdata-ln-[\w-]+'
- '--ln-[\w-]+'
