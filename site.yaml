# Site-owned identity, feeds, taxonomy, navigation and standalone pages.
# Feature switches follow in a later extraction step.
title: Levi Neuwirth
author: Levi Neuwirth
author-sort: Neuwirth, Levi
email: ln@levineuwirth.org
contact-email: ln@levineuwirth.org
url: https://levineuwirth.org
host: levineuwirth.org
source-repo: https://git.levineuwirth.org/neuwirth/levineuwirth.org
source-branch: main
forge-host: git.levineuwirth.org
content-license: CC-BY-NC-SA-4.0
code-license: MIT
signing-fingerprint: C9A42A6F AD444FBE 566FD738 531BDC1C C2707066
manifest:
  name: Levi Neuwirth
  short-name: ln
  description: Personal site of Levi Neuwirth — essays, research, music, and photography.
  theme-color: '#16140f'
  background-color: '#16140f'
feeds:
  - path: feed.xml
    title: Levi Neuwirth
    description: Essays, notes, and creative work by Levi Neuwirth
    sections: [essays, blog, fiction, poetry, music]
    advertise: true
    limit: 30
  - path: music/feed.xml
    title: Levi Neuwirth — Music
    advertise-title: Levi Neuwirth — music
    description: New compositions by Levi Neuwirth
    sections: [music]
    advertise: true
    limit: null
  - path: photography/feed.xml
    title: Levi Neuwirth — Photography
    advertise-title: Levi Neuwirth — photography
    description: New photographs by Levi Neuwirth
    sections: [photography]
    advertise: true
    limit: 30
# Content sections, keyed by directory: their pages' label on the New page
# (kind) and default ornament (dingbat). The engine's section routes are
# fixed: exactly these six directories.
sections:
  - {dir: essays, kind: Essay, dingbat: fleuron}
  - {dir: blog, kind: Post, dingbat: lozenge}
  - {dir: poetry, kind: Poem, dingbat: trefoil}
  - {dir: fiction, kind: Fiction, dingbat: asterisks}
  - {dir: music, kind: Composition, dingbat: clef}
  - {dir: photography, kind: Photo}
# Home-page portals in order; each is a top-level tag with a page at /<tag>/.
portals:
  - {name: Research, tag: research}
  - {name: Nonfiction, tag: nonfiction}
  - {name: Fiction, tag: fiction}
  - {name: Poetry, tag: poetry}
  - {name: Music, tag: music}
  - {name: Photography, tag: photography}
  - {name: AI, tag: ai}
  - {name: Tech, tag: tech}
  - {name: Miscellany, tag: miscellany}
nav-primary:
  - {label: Home, href: /}
  - {label: Current, href: /current.html}
  - {label: Library, href: /library.html}
  - {label: Links, href: /links.html}
  - {label: Me, href: /me.html}
  - {label: New, href: /new.html}
  - {label: Search, href: /search.html}
  - {label: Work, href: /work.html}
library:
  shelf-cap: 4
  shelf-max: 5
  description: >-
    Everything on this site, arranged by shelf: essays, fiction, poetry,
    music, photography, and research.
  see-also:
    - {label: New, href: /new.html}
    - {label: Commonplace, href: /commonplace.html}
    - {label: Colophon, href: /colophon.html}
    - {label: Bibliography, href: /bibliography/}
# One-off pages: source, route, template (under templates/) and the engine
# context they are compiled with (essay, page, now, vita, projects). scores
# copies the score fragments beside a source in its own directory; dingbat is
# the page's default ornament; flags are template booleans.
standalone:
  - {source: content/me/index.md, route: me.html, template: essay.html, context: essay,
     scores: true}
  - {source: content/memento-mori/index.md, route: memento-mori.html, template: essay.html,
     context: essay, scores: true, dingbat: memento, flags: [memento-mori]}
  - {source: content/current.md, route: current.html, template: current.html, context: now}
  - {source: content/colophon.md, route: colophon.html, template: essay.html, context: essay}
  - {source: content/about.md, route: about.html, template: vita.html, context: vita}
  - {source: content/cv/projects.md, route: cv/projects/index.html, template: projects.html,
     context: projects}
