# Site-owned identity, feeds, taxonomy, navigation and standalone pages.
# Feature switches follow in a later extraction step.
title: Levi Neuwirth
author: Levi Neuwirth
author-sort: Neuwirth, Levi
email: ln@levineuwirth.org
contact-email: ln@levineuwirth.org
url: https://levineuwirth.org
host: levineuwirth.org
source-repo: https://git.levineuwirth.org/neuwirth/levineuwirth.org
source-branch: main
forge-host: git.levineuwirth.org
# The engine's repository: prose naming one of its files links there.
engine-repo: https://git.levineuwirth.org/neuwirth/ozymandias
# What /source/ publishes of this site's own files, for the source-refs
# switch's popups, as globs over its paths. checklist.md stays out of it:
# .gitignore calls it a local planning document (audit S01). The JSON under
# data/ is named file by file, since data/ also holds build state.
source-preview:
  - static/js/**
  - static/css/**
  - templates/**
  - tools/**.sh
  - tools/**.py
  - content/essays/crawler_chronicles/data/*.py
  - content/essays/crawler_chronicles/data/commit-response/source/*.py
  - content/essays/crawler_chronicles/data/commit-response/source/*.sh
  - nginx/**.conf
  - data/*.yaml
  - data/*.md
  - data/*.bib
  - data/annotations.json
  - data/similar-links.json
  - cabal.project
  - Makefile
  - LICENSE
  - WRITING.md
  - PHOTOGRAPHY.md
  - README.md
content-license: CC-BY-NC-SA-4.0
code-license: GPL-2.0-or-later
signing-fingerprint: C9A42A6F AD444FBE 566FD738 531BDC1C C2707066
# The faces of the first screen, preloaded beside the stylesheets
# (templates/partials/head.html): subsets engine/tools/subset-fonts.py
# makes from tools/fonts.yaml's families.
font-preloads:
  - /fonts/spectral-regular.woff2
  - /fonts/fira-sans-semibold.woff2
  - /fonts/fira-sans-regular.woff2
# Seasonal dressings over a theme (engine: Config.Season). While a season's
# window is open (month-day, inclusive), a reader with no stored theme wears
# it and Settings offers it; afterwards, one who chose it gets its base.
seasons:
  - id: halloween
    label: Blood Moon
    base: dark
    from: 10-29
    to: 11-02
    stylesheet: /css/seasons/halloween.css
    script: /js/seasons/halloween.js
manifest:
  name: Levi Neuwirth
  short-name: ln
  description: Personal site of Levi Neuwirth — essays, research, music, and photography.
  theme-color: '#16140f'
  background-color: '#16140f'
feeds:
  - path: feed.xml
    title: Levi Neuwirth
    description: Essays, notes, and creative work by Levi Neuwirth
    sections: [essays, blog, fiction, poetry, music]
    advertise: true
    limit: 30
  - path: music/feed.xml
    title: Levi Neuwirth — Music
    advertise-title: Levi Neuwirth — music
    description: New compositions by Levi Neuwirth
    sections: [music]
    advertise: true
    limit: null
  - path: photography/feed.xml
    title: Levi Neuwirth — Photography
    advertise-title: Levi Neuwirth — photography
    description: New photographs by Levi Neuwirth
    sections: [photography]
    advertise: true
    limit: 30
# Content sections, keyed by directory: their pages' label on the New page
# (kind) and default ornament (dingbat). The engine's section routes are
# fixed: exactly these six directories.
sections:
  - {dir: essays, kind: Essay, dingbat: fleuron}
  - {dir: blog, kind: Post, dingbat: lozenge}
  - {dir: poetry, kind: Poem, dingbat: trefoil}
  - {dir: fiction, kind: Fiction, dingbat: asterisks}
  - {dir: music, kind: Composition, dingbat: clef}
  - {dir: photography, kind: Photo}
# Home-page portals in order; each is a top-level tag with a page at /<tag>/.
portals:
  - {name: Research, tag: research}
  - {name: Nonfiction, tag: nonfiction}
  - {name: Fiction, tag: fiction}
  - {name: Poetry, tag: poetry}
  - {name: Music, tag: music}
  - {name: Photography, tag: photography}
  - {name: AI, tag: ai}
  - {name: Tech, tag: tech}
  - {name: Miscellany, tag: miscellany}
nav-primary:
  - {label: Home, href: /}
  - {label: Current, href: /current.html}
  - {label: Library, href: /library.html}
  - {label: Links, href: /links.html}
  - {label: Me, href: /me.html}
  - {label: New, href: /new.html}
  - {label: Search, href: /search.html}
  - {label: Work, href: /work.html}
library:
  shelf-cap: 4
  shelf-max: 5
  description: >-
    Everything on this site, arranged by shelf: essays, fiction, poetry,
    music, photography, and research.
  see-also:
    - {label: New, href: /new.html}
    - {label: Commonplace, href: /commonplace.html}
    - {label: Colophon, href: /colophon.html}
    - {label: Bibliography, href: /bibliography/}
# One-off pages: source, route, template (under templates/) and the engine
# context they are compiled with (essay, page, now, vita, projects). scores
# copies the score fragments beside a source in its own directory; dingbat is
# the page's default ornament; flags are template booleans.
standalone:
  - {source: content/me/index.md, route: me.html, template: essay.html, context: essay,
     scores: true}
  - {source: content/memento-mori/index.md, route: memento-mori.html, template: essay.html,
     context: essay, scores: true, dingbat: memento, flags: [memento-mori]}
  - {source: content/current.md, route: current.html, template: current.html, context: now}
  - {source: content/colophon.md, route: colophon.html, template: essay.html, context: essay}
  - {source: content/about.md, route: about.html, template: vita.html, context: vita}
  - {source: content/cv/projects.md, route: cv/projects/index.html, template: projects.html,
     context: projects}
# Where the site explains its epistemic profile: the footer's Epistemic
# heading links there.
epistemic-about: /colophon.html#living-documents
epistemic-about-label: Colophon
# Link previews from other sites: all that popups.js has. nginx/ allows and
# proxies each of them.
popup-providers: [wikipedia, arxiv, doi, github, openlibrary, biorxiv, medrxiv, youtube, archive, pubmed]
# The engine's switches this site sets (engine/switches.yaml has each one's
# default and what it covers): everything on.
switches:
  archive: true
  music: true
  photography: true
  math: true
  code: true
  viz: true
  pdf-viewer: true
  source-refs: true
  code-refs: true
  epistemic: true
  marks: true
  vita: true
  commonplace: true
  now: true
  signing: true
  signature-link: true
  stats-page: true
  build-page: true
  footer-build-time: true
  tag-pages: true
  new: true
  authors: true
  random: true
  library: true
  bibliography: true
  bibliography-index: true
  selection-toolbar: true
  annotations: true
  popups: true
  search-filters: true
  semantic-search: true
  similar-links: true
  transclusion: true
  dingbats: true
  reading-progress: true
