    section: research
    status: in-review
    updated: 2026-09-25
    link: /essays/beyond-comorbidity-indices/
    note: >-
      Research on predicting readmission and mortality from diagnosis-code
      sets. September calculator work added code-level explanations using
      Integrated Gradients. The manuscript remains under review at JAMIA.

