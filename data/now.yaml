entries:
  - title: "VerInf: Verifiable LLM Inference (MARS V)"
    section: research
    status: drafting
    updated: 2026-11-06
    priority: 2
    link: /essays/verified-inference/
    note: >-
      I worked on profiling, prover optimization, and verifier hardening for
      James Petrie's VerInf project through MARS V. Anthropic cited VerInf as
      prior work in its 2 November FlashProve research. We are finalizing our
      publication for release by the end of this year.

  - title: "Proof Broker"
    section: research
    status: drafting
    updated: 2026-10-02
    priority: 1
    link: /essays/proof-broker/
    note: >-
      Proof Broker connects Lean and Rocq to untrusted solvers and model-generated
      certificates, with independent checks and kernel-checked proofs.
      I am preparing a manuscript on certificate attribution: whether the
      returned evidence actually justifies the accepted proof. The draft and
      its retrospective binding audit remain unreleased; the published R6
      experiments and subsequent replay provide the evidence base.

  - title: "Graph theory: pursuit and initial placement"
    section: research
    status: building
    updated: 2026-10-06
    link: /essays/timed-guarding-in-degree-reduction-clouds.html
    note: >-
      Studying how initial cop placement and travel time constrain pursuit
      strategies, alongside the public preprints on conditional pursuit bounds
      and growing-radius domination. Recent optimization experiments measure
      the cost of one placement serving several possible robber starting
      positions, with certificates checked in exact arithmetic. Extending
      these finite results to general pursuit guarantees remains open.

