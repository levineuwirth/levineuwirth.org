# Now — research-first status feed for /current.html.
#
# `last-updated` is the page-level temporal stamp. Bump it whenever
# you push any change here, even a one-line note edit; the value is
# rendered prominently; a relative-time tail ("4 days ago") is added
# by the browser from the date, so static HTML cannot carry a stale age.
#
# `entries:` are active items. Each carries:
#   - title    : display name
#   - section  : free-form section key (research, engineering, …);
#                sections render in first-appearance order
#   - status   : accepted | in-review | revising | drafting | building |
#                early-stage | paused. Free-form, but the listed values are
#                the canonical ladder (closest-to-shipping → furthest) and
#                have CSS accents. "accepted" is for a paper/talk past review
#                and locked in for publication or presentation.
#   - updated  : YYYY-MM-DD when this entry last moved (NOT page-stamp)
#   - link     : optional URL (artifact, preprint, repo, etc.)
#   - note     : optional one-sentence what's-happening-now line
#   - priority : optional integer (default 0). Manual override on the sort
#                order: positive floats up, negative sinks down. Use sparingly
#                — the status ladder already captures most of the signal;
#                priority is for "this is the headline regardless of where
#                its status puts it" (or vice versa).
#
# Sort within each section: priority desc → staleness bucket asc →
# status rank asc → updated desc. The staleness bucket is computed at
# build time from `updated` (0: within 14 days, 1: within 60, 2: older)
# and outranks the status ladder, so a fresh `building` item sits above
# a stale `in-review` one. An entry can therefore change position with
# no edit here, as it ages out of a bucket.
# Section order: first-appearance in this file. Rearrange to taste.
#
# `shipped:` are recently-completed items. Each carries:
#   - title, completed (date), optional link, optional note
# Sorted newest-first at render time. Curate by hand — items don't
# auto-prune. Move things off the list when they stop earning the slot.

last-updated: 2026-10-08

entries:
  - title: "VerInf: Verified Inference and Scale-Out (MARS V)"
    section: research
    status: building
    updated: 2026-10-08
    priority: 2
    link: /essays/verified-inference/
    note: "I own profiling and scale-out for VerInf, which develops proofs of language-model inference that mutually distrustful parties can check on their own hardware. The profiler, weight split, caches, bridge integration, and subsequent constraint repairs are merged upstream (pull requests 21–25). Archived Maverick proofs lack complete model binding; draft pull request 31 proposes a repair, with its GPU gate, new enrollment, and re-proof still outstanding. Weight splitting has passed proof-byte equivalence and independent Rust verification on one GPU; multi-device execution remains in progress. The experimental weight bridge's intended privacy protection and its profiler cost model remain unfinished. I work on this as a MARS V fellow, mentored by James Petrie (FLI)."

  - title: "Proof Broker"
    section: research
    status: building
    updated: 2026-10-01
    priority: 1
    link: /essays/proof-broker/
    note: "Proof Broker routes Lean 4 and Rocq goals to untrusted solvers and LLMs, checking evidence before kernel-verified closure. R4 closed 19/19 targeted VerInf obligations; R5 consolidated spec v1.1. R6, an audited live-model evaluation on 15 VerInf obligations, is closed: all 80 certificate-feasible slots returned a verified witness, and proofs covered 6 of 15 obligations (48 of 88 slots), unchanged across eight draws and two more than the deterministic baseline. Posing goals and turning certificates into proofs, not finding them, was the constraint. The evaluation ran under two post-collection amendments, both published with it."

  - title: "Timed Guarding in Degree-Reduction Clouds"
    section: research
    status: revising
    updated: 2026-09-09
    link: /essays/timed-guarding-in-degree-reduction-clouds.html
    note: "Mathematics preprint proving a square-root cop bound for actual stopping-rule degree-reduction towers over bases satisfying fixed multistage expansion and accessibility hypotheses. Port placement and synchronized guarding remove the cloud-order factor. The follow-up gives an explicit whole-tower lower-transfer proof and an exact criterion for guarding adjacent-cloud unions. The remaining full-ball Hall requirement still blocks the proposed shrinking-base route to Meyniel's conjecture."

  - title: "Branch-Tube Persistence and Static Coverage in Tree-Ball Geometry"
    section: research
    status: revising
    updated: 2026-09-05
    link: /essays/branch-based-local-capture-in-tree-balls/
    note: "Mathematics preprint on path-tube persistence, exhaustive static coverage, conditional sampling thresholds, and information loss in d-regular tree-balls. Audit corrections landed 5 September 2026: the root-degree statement corrected, admissible-root coverage clarified with a counterexample to residual domination."

  - title: "The Annealed Critical Window for Growing-Radius Domination in Random Regular Graphs"
    section: research
    status: revising
    updated: 2026-09-09
    link: /essays/near-critical-growing-radius-domination.html
    note: "Mathematics preprint determining the bounded annealed critical window for growing-radius domination in random regular graphs — its universal scaling function and a scalar coupon-root asymptotic expansion. A bounded literature pass closed 5 September 2026, with the Duckworth–Mans attribution corrected and the relative overlap estimate completed. Typical existence in the growing-radius window remains open. A separate timed cloud-guarding paper now resolves the cloud-order loss in the conditional multistage pursuit transfer."

  - title: "Order-Invariant ICD-10-CM Embedding (JAMIA submission)"
