<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-labelledby="mark-title-timed-guarding">
  <title id="mark-title-timed-guarding">Two adjacent ancestry clouds joined by a single edge, the left one carrying a rooted port tree with a guard at its anchor and a dashed projection of an exterior robber onto that tree, above a ruler splitting the deployment allowance into port travel and exterior setup</title>
  <desc>A frontispiece mark for "Timed Guarding in Degree-Reduction Clouds." Two closed contours are the ancestry clouds of adjacent base vertices; exactly one edge joins them, as the replacement rule requires. Inside the left cloud a breadth-first tree runs from the anchor port — the designated port toward its neighbor — out to the cloud's other designated ports, each of which carries one external edge to a filled exterior neighbor. A ring at the anchor is the single retained guard; a hollow ring on the tree is the retracted image of the exterior robber, joined to her actual position by a dashed projection line. Below, a ruler carries the deployment budget: a filled tick where a port-anchored cop is dispatched, a middle tick where port travel ends, and a hollow tick at the entry deadline, with a bracket over the final segment — the lambda minus one moves that establish the guard.</desc>

  <circle cx="140" cy="140" r="128" stroke="currentColor" stroke-width="0.6" fill="none"/>

  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.6" opacity="0.75">
    <path d="M 56 132 C 56 104, 76 86, 102 86 C 128 86, 148 104, 148 132 C 148 160, 128 178, 102 178 C 76 178, 56 160, 56 132 Z"/>
    <path d="M 178 132 C 178 114, 191 100, 208 100 C 225 100, 238 114, 238 132 C 238 150, 225 164, 208 164 C 191 164, 178 150, 178 132 Z"/>
  </g>

  <line x1="148" y1="132" x2="178" y2="132" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>

  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.0">
    <polyline points="148,132 126,127 104,114 70,104"/>
    <polyline points="104,114 102,88"/>
    <polyline points="126,127 104,146 70,160"/>
  </g>

  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-width="0.8">
    <line x1="70" y1="104" x2="48" y2="96"/>
    <line x1="70" y1="160" x2="48" y2="170"/>
    <line x1="102" y1="88" x2="102" y2="64"/>
  </g>

  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.5" opacity="0.8">
    <polyline points="178,132 197,123 208,100"/>
    <polyline points="178,132 200,139 238,132"/>
  </g>

  <g fill="currentColor" stroke="none">
    <circle cx="70" cy="104" r="1.9"/>
    <circle cx="70" cy="160" r="1.9"/>
    <circle cx="102" cy="88" r="1.9"/>
    <circle cx="178" cy="132" r="1.9"/>
    <circle cx="208" cy="100" r="1.5"/>
    <circle cx="238" cy="132" r="1.5"/>
    <circle cx="126" cy="127" r="1.2"/>
    <circle cx="104" cy="114" r="1.2"/>
    <circle cx="197" cy="123" r="1.0"/>
    <circle cx="200" cy="139" r="1.0"/>
    <circle cx="48" cy="96" r="1.5"/>
    <circle cx="48" cy="170" r="1.5"/>
    <circle cx="102" cy="64" r="1.5"/>
    <circle cx="52" cy="196" r="2.4"/>
  </g>

  <line x1="52" y1="196" x2="104" y2="146" stroke="currentColor" stroke-width="0.5"
        stroke-linecap="round" stroke-dasharray="3 3" opacity="0.6" fill="none"/>

  <circle cx="104" cy="146" r="3.4" stroke="currentColor" stroke-width="0.8" fill="none"/>

  <circle cx="148" cy="132" r="4.6" stroke="currentColor" stroke-width="0.8" fill="none"/>
  <circle cx="148" cy="132" r="1.6" fill="currentColor" stroke="none"/>

  <line x1="62" y1="230" x2="218" y2="230" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"/>

  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-width="0.9">
    <line x1="62" y1="224" x2="62" y2="236"/>
    <line x1="170" y1="224" x2="170" y2="236"/>
    <line x1="218" y1="224" x2="218" y2="236"/>
  </g>

  <circle cx="62" cy="230" r="2.0" fill="currentColor" stroke="none"/>
  <circle cx="218" cy="230" r="2.0" stroke="currentColor" stroke-width="0.9" fill="none"/>

  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-width="0.7">
    <line x1="170" y1="214" x2="218" y2="214"/>
    <line x1="170" y1="211" x2="170" y2="217"/>
    <line x1="218" y1="211" x2="218" y2="217"/>
  </g>

</svg>
