<svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mark-title-doorstep-ledger">
  <title id="mark-title-doorstep-ledger">The Crawler Chronicles' spider, hanging on its thread under a magnifying glass.</title>
  <desc>Frontmatter mark for "The Doorstep Ledger", a variant of the mark of "Crawler Chronicles".</desc>

  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

    <!-- Outer roundel -->
    <circle cx="140" cy="140" r="128" stroke-width="0.6"/>

    <!-- The lens: frame, inner rim and a glint -->
    <circle cx="124" cy="124" r="58" stroke-width="1.4"/>
    <circle cx="124" cy="124" r="53" stroke-width="0.5"/>
    <path d="M 78.9 107.58 A 48 48 0 0 1 100 82.43" stroke-width="0.8"/>

    <!-- The handle, along the diagonal from the frame -->
    <g transform="rotate(45 124 124)" stroke-width="1.4">
      <line x1="182" y1="124" x2="190" y2="124"/>
      <rect x="190" y="117" width="66" height="14" rx="7"/>
    </g>

    <!-- The thread, from the rim down to the spinnerets -->
    <line x1="124" y1="71" x2="124" y2="100" stroke-width="0.5"/>

    <!-- The spider of the essay's mark, moved under the glass: eight legs -->
    <g stroke-width="1.2" transform="translate(-16 -77)">
      <path d="M 144.06 212.525 L 157.4 217.6 L 161.75 237.9"/>
      <path d="M 145.51 209.625 L 164.65 207.45 L 176.25 223.4"/>
      <path d="M 145.51 205.275 L 164.65 192.95 L 177.7 197.3"/>
      <path d="M 144.06 202.375 L 158.85 182.8 L 173.35 174.1"/>
      <path d="M 135.94 212.525 L 122.6 217.6 L 118.25 237.9"/>
      <path d="M 134.49 209.625 L 115.35 207.45 L 103.75 223.4"/>
      <path d="M 134.49 205.275 L 115.35 192.95 L 102.3 197.3"/>
      <path d="M 135.94 202.375 L 121.15 182.8 L 106.65 174.1"/>
    </g>
  </g>

  <g fill="currentColor" stroke="none" transform="translate(-16 -77)">
    <!-- The spider: abdomen above (it hangs head down), then the head -->
    <ellipse cx="140" cy="188.6" rx="10.15" ry="11.6"/>
    <circle cx="140" cy="206.725" r="6.525"/>
  </g>
</svg>
