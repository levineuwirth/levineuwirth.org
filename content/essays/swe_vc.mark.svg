<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-labelledby="mark-title-provenance-v2">
  <title id="mark-title-provenance-v2">A LEGO brick drawn in three-quarter view with an empty cartouche on its front face — the artifact of provenance with the warrant plate blank</title>
  <desc>A frontispiece mark for "Provenance Is Not Warrant." A single LEGO brick, drawn in three-quarter isometric view with four studs in a 2x2 grid on top — the back row slightly smaller than the front to convey depth. On the front face of the brick, a thin blank cartouche occupies the central third — an empty label plate where a specification or warrant would go. The brick is well-formed and looks solid; the blank plate is the essay's argument in one detail: this artifact has a place for warrant, and the place is empty.</desc>

  <circle cx="140" cy="140" r="128" stroke="currentColor" stroke-width="0.6" fill="none"/>

  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2">
    <path d="M 62 128 L 62 220 L 178 220 L 178 128 Z"/>

    <path d="M 62 128 L 92 96 L 208 96 L 178 128"/>

    <path d="M 178 128 L 208 96 L 208 188 L 178 220"/>

    <line x1="178" y1="128" x2="208" y2="96" stroke-width="0.5" opacity="0.6"/>
  </g>

  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.9">
    <ellipse cx="117" cy="104" rx="7" ry="3"/>
    <line x1="110" y1="104" x2="110" y2="107" stroke-width="0.7"/>
    <line x1="124" y1="104" x2="124" y2="107" stroke-width="0.7"/>
    <path d="M 110 107 A 7 3 0 0 0 124 107" stroke-width="0.7"/>

    <ellipse cx="168" cy="104" rx="7" ry="3"/>
    <line x1="161" y1="104" x2="161" y2="107" stroke-width="0.7"/>
    <line x1="175" y1="104" x2="175" y2="107" stroke-width="0.7"/>
    <path d="M 161 107 A 7 3 0 0 0 175 107" stroke-width="0.7"/>

    <ellipse cx="104" cy="118" rx="8" ry="3.5"/>
    <line x1="96"  y1="118" x2="96"  y2="122" stroke-width="0.7"/>
    <line x1="112" y1="118" x2="112" y2="122" stroke-width="0.7"/>
    <path d="M 96 122 A 8 3.5 0 0 0 112 122" stroke-width="0.7"/>

    <ellipse cx="155" cy="118" rx="8" ry="3.5"/>
    <line x1="147" y1="118" x2="147" y2="122" stroke-width="0.7"/>
    <line x1="163" y1="118" x2="163" y2="122" stroke-width="0.7"/>
    <path d="M 147 122 A 8 3.5 0 0 0 163 122" stroke-width="0.7"/>
  </g>

  <rect x="86" y="158" width="68" height="34"
        stroke="currentColor" stroke-width="0.9" fill="none"
        stroke-linejoin="miter" stroke-linecap="butt"/>

  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.5" opacity="0.7">
    <line x1="72"  y1="220" x2="80"  y2="228"/>
    <line x1="94"  y1="220" x2="102" y2="228"/>
    <line x1="116" y1="220" x2="124" y2="228"/>
    <line x1="138" y1="220" x2="146" y2="228"/>
    <line x1="160" y1="220" x2="168" y2="228"/>

    <path d="M 80 228 L 196 228" stroke-dasharray="2 3" opacity="0.6"/>
    <path d="M 196 228 L 208 216" stroke-dasharray="2 3" opacity="0.6"/>
  </g>

</svg>
