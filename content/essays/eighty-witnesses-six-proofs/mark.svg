<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-labelledby="mark-title-eighty-witnesses">
  <title id="mark-title-eighty-witnesses">Eighty small open squares in ten identical rows of eight; the top six rows run through a vertical line to a heavy ring on the left, and the bottom four stop just short of it</title>
  <desc>A frontispiece mark for "Eighty Verified Witnesses, Six Proofs." Each open square is one verified witness: ten certificate-feasible obligations, eight draws each, every column alike, because repetition changed nothing. The vertical line is the closer. Six rows pass through it and converge on the kernel, a heavy ring around a point, as in the Proof Broker mark; the other four end in a short stop before reaching it. The witnesses were never the constraint: the step into a proof was.</desc>

