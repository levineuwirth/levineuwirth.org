    <line x1="62.0" y1="177.0" x2="76.0" y2="177.0"/>
    <line x1="62.0" y1="181.0" x2="76.0" y2="181.0"/>
    <line x1="62.0" y1="185.0" x2="70.0" y2="185.0"/>
    <line x1="51.0" y1="136.0" x2="65.0" y2="136.0"/>
    <line x1="51.0" y1="140.0" x2="65.0" y2="140.0"/>
    <line x1="51.0" y1="144.0" x2="59.0" y2="144.0"/>
