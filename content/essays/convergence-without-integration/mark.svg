    <line x1="62.0" y1="99.0" x2="76.0" y2="99.0"/>
    <line x1="62.0" y1="103.0" x2="70.0" y2="103.0"/>
    <line x1="92.0" y1="65.0" x2="106.0" y2="65.0"/>
