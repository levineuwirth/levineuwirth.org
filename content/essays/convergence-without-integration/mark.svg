<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-labelledby="mark-title-convergence-without-integration">
  <title id="mark-title-convergence-without-integration">Twelve small closed circles in a ring around one dot; each circle holds the same three lines of text, faint dotted threads run to each from the dot at the center, and a short tick on each circle points outward, away from the others</title>
  <desc>A frontispiece mark for "Convergence Without Integration." Chwe's public is a crowd in an inward-facing circle, each person seeing the others see. Here the circle is turned inside out: twelve private rooms, each facing away from the rest, each holding the identical paragraph. They are fed by threads too faint to notice from one source at the center, which none of them faces. Convergence, without the common knowledge of it.</desc>

  <circle cx="140" cy="140" r="128" stroke="currentColor" stroke-width="0.6" fill="none"/>

  <!-- One source, reaching every room by threads too faint to notice. -->
  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-width="0.5" stroke-dasharray="0.8 3" opacity="0.7">
    <line x1="140.0" y1="130.0" x2="140.0" y2="75.0"/>
    <line x1="145.0" y1="131.3" x2="172.5" y2="83.7"/>
    <line x1="148.7" y1="135.0" x2="196.3" y2="107.5"/>
    <line x1="150.0" y1="140.0" x2="205.0" y2="140.0"/>
    <line x1="148.7" y1="145.0" x2="196.3" y2="172.5"/>
    <line x1="145.0" y1="148.7" x2="172.5" y2="196.3"/>
    <line x1="140.0" y1="150.0" x2="140.0" y2="205.0"/>
    <line x1="135.0" y1="148.7" x2="107.5" y2="196.3"/>
    <line x1="131.3" y1="145.0" x2="83.7" y2="172.5"/>
    <line x1="130.0" y1="140.0" x2="75.0" y2="140.0"/>
    <line x1="131.3" y1="135.0" x2="83.7" y2="107.5"/>
    <line x1="135.0" y1="131.3" x2="107.5" y2="83.7"/>
  </g>
  <circle cx="140" cy="140" r="2.4" fill="currentColor" stroke="none"/>

  <!-- Twelve private rooms. -->
  <g stroke="currentColor" fill="none" stroke-width="1.0">
    <circle cx="140.0" cy="58.0" r="14"/>
    <circle cx="181.0" cy="69.0" r="14"/>
    <circle cx="211.0" cy="99.0" r="14"/>
    <circle cx="222.0" cy="140.0" r="14"/>
    <circle cx="211.0" cy="181.0" r="14"/>
    <circle cx="181.0" cy="211.0" r="14"/>
    <circle cx="140.0" cy="222.0" r="14"/>
    <circle cx="99.0" cy="211.0" r="14"/>
    <circle cx="69.0" cy="181.0" r="14"/>
    <circle cx="58.0" cy="140.0" r="14"/>
    <circle cx="69.0" cy="99.0" r="14"/>
    <circle cx="99.0" cy="69.0" r="14"/>
  </g>

  <!-- The same paragraph in every room. -->
  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-width="1.0">
    <line x1="133.0" y1="54.0" x2="147.0" y2="54.0"/>
    <line x1="133.0" y1="58.0" x2="147.0" y2="58.0"/>
    <line x1="133.0" y1="62.0" x2="141.0" y2="62.0"/>
    <line x1="174.0" y1="65.0" x2="188.0" y2="65.0"/>
    <line x1="174.0" y1="69.0" x2="188.0" y2="69.0"/>
    <line x1="174.0" y1="73.0" x2="182.0" y2="73.0"/>
    <line x1="204.0" y1="95.0" x2="218.0" y2="95.0"/>
    <line x1="204.0" y1="99.0" x2="218.0" y2="99.0"/>
    <line x1="204.0" y1="103.0" x2="212.0" y2="103.0"/>
    <line x1="215.0" y1="136.0" x2="229.0" y2="136.0"/>
    <line x1="215.0" y1="140.0" x2="229.0" y2="140.0"/>
    <line x1="215.0" y1="144.0" x2="223.0" y2="144.0"/>
