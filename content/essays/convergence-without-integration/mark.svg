    <line x1="174.0" y1="207.0" x2="188.0" y2="207.0"/>
    <line x1="174.0" y1="211.0" x2="188.0" y2="211.0"/>
    <line x1="174.0" y1="215.0" x2="182.0" y2="215.0"/>
    <line x1="133.0" y1="218.0" x2="147.0" y2="218.0"/>
    <line x1="133.0" y1="222.0" x2="147.0" y2="222.0"/>
    <line x1="133.0" y1="226.0" x2="141.0" y2="226.0"/>
    <line x1="92.0" y1="207.0" x2="106.0" y2="207.0"/>
    <line x1="92.0" y1="211.0" x2="106.0" y2="211.0"/>
