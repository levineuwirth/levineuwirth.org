    <line x1="92.0" y1="73.0" x2="100.0" y2="73.0"/>
  </g>

  <!-- Each room faces outward: no one sees the others seeing. -->
  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-width="0.8">
    <line x1="140.0" y1="41.0" x2="140.0" y2="33.0"/>
    <line x1="189.5" y1="54.3" x2="193.5" y2="47.3"/>
    <line x1="225.7" y1="90.5" x2="232.7" y2="86.5"/>
    <line x1="239.0" y1="140.0" x2="247.0" y2="140.0"/>
    <line x1="225.7" y1="189.5" x2="232.7" y2="193.5"/>
