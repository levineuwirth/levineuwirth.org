    <line x1="140" y1="78" x2="140" y2="98" stroke-width="1.2"/>

    <line x1="140" y1="98" x2="108" y2="118" stroke-width="1.0"/>
    <line x1="140" y1="98" x2="172" y2="118" stroke-width="1.0"/>

    <line x1="108" y1="118" x2="92"  y2="142" stroke-width="0.8"/>
