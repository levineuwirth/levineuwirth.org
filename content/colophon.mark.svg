    <line x1="172" y1="118" x2="162" y2="142" stroke-width="0.8"/>
    <line x1="172" y1="118" x2="184" y2="148" stroke-width="0.8"/>

    <line x1="92"  y1="142" x2="84"  y2="166" stroke-width="0.6"/>
