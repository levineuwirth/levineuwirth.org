<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-labelledby="mark-title-me">
  <title id="mark-title-me">An invented constellation over a still pre-dawn bay, reflected below as a fainter, flattened copy, with one star resting on the horizon and a brighter anchor-star apart from the figure</title>
  <desc>A frontispiece mark for the author's about page. The constellation is invented for this page: its stars mark the page's named preoccupations (curiosity-and-creativity, aphantasia, music, mathematics, systems, language, running), the lines mark which connect to which, and a heavier point off the figure stands for the one favorite the page admits — Karamazov. Below the horizon the bay reflects the figure as the page reflects the person: every star and every connection survives, but the shape is flattened and broken by ripples, a copy isomorphic to the original and not identical with it. The eighth star, the present moment, sits on the horizon itself, the only point that is its own reflection; the short glitter beneath it is dawn over a Rhode Island bay. No portrait, no initials, no logo: a person via their relations.</desc>

  <circle cx="140" cy="140" r="128" stroke="currentColor" stroke-width="0.6" fill="none"/>

  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.6" opacity="0.8">
