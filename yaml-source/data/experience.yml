# Experience entries. `resume_order` drives the résumé's Experience sort
# (research-first: MARS V, the two Shu Lab stints, contracting, then NeuroAI).
# `cv_order` documents intent; the CV template renders in file order within
# each section, so keep file order and cv_order consistent. The two axes let
# us order independently per audience without duplicating content.

experience:
  # MARS V heads both documents. On the CV it is routed into "Research
  # Experience" via cv_section and sits first because it appears first among
  # research entries in this file (the CV template preserves file order).
  - id: mars-v
    organization: Cambridge AI Safety Hub
    role: MARS V Fellow
    location: Cambridge, United Kingdom
    start: July 2026
    end: Present
    cv_section: research
    cv_order: 1
    resume_order: 1
    cv_visible: true
    resume_visible: true
    bullets:
      - "Selected for MARS V, a competitive part-time AI-safety research fellowship, working under James Petrie (Future of Life Institute)."
      - "Research on zero-knowledge proofs for large language models, toward cryptographic verification of claims about model training, inference, and deployment."
    presentation_sets:
      ai-infra-assurance:
        bullets:
          - >-
            Develop cryptographic mechanisms for trustworthy claims about LLM
            inference when the compute operator and its logs cannot be trusted.
            Built and upstreamed VerInf's dry-run profiler: workload-manifest
            contract and extraction, per-claim proving-cost model, execution DAG,
            and partition scorecard for planning multi-accelerator proving.
          - >-
            Validated the profiler and cost model in two rounds: retrodiction
            against an archived full-scale Llama-4 Maverick proof run, then
            end-to-end calibration and tape extraction on a live NVIDIA B200
            (Blackwell). Independent manifest producers cross-checked clean; the
            extracted workload reported 109.274 M witness rows against the
            archived production record's 109.27 M.
          - >-
            Used measurement/model disagreement to identify and correct a faulty
            cross-shard communication abstraction, revising the estimate from
            roughly 950 GB to 2.4--2.8 GB per sweep; upstreamed the correction,
            calibration suite, and machine profile. Current work extends the
            prover toward verifier-transparent partitioning and 2--8-GPU
            execution; current scaling estimates are model-based, with end-to-end
            multi-device timing as the next empirical milestone.
      frontier-evals-control:
        bullets:
          - >-
            Develop zero-knowledge mechanisms for trustworthy claims about
            frontier-model execution when the compute operator, its logs, or
            other evidence-producing components cannot simply be trusted. Built
            VerInf tooling that makes workload extraction and per-claim proving
            costs explicit and independently checkable.
          - >-
            Built and upstreamed a dry-run profiler, workload-manifest contract,
            per-claim cost model, execution DAG, and partition scorecard.
            Validated them against an archived full-scale Llama-4 Maverick proof
            run and on a live NVIDIA B200; two independent manifest builders
            cross-checked clean, and the extracted workload reported 109.274 M
            witness rows against the production record's 109.27 M.
          - >-
            Investigated a measurement/model discrepancy that exposed a faulty
            cross-shard communication abstraction, revising its per-sweep
            estimate from roughly 950 GB to 2.4--2.8 GB. Upstreamed the
            correction, calibration suite, and machine profile; current
            multi-GPU work proceeds from the corrected model, with projected
            partition plans to be tested through end-to-end multi-device timing.
      inference-systems-performance:
        bullets:
          - >-
            Built and upstreamed VerInf's dry-run workload profiler:
            workload-manifest contract and extraction, per-claim proving-cost
            model, execution DAG, and partition scorecard for modeling compute,
            communication, and partition costs in multi-accelerator proving.
          - >-
            Validated the instrumented model in two rounds: retrodiction against
            an archived full-scale Llama-4 Maverick proof run, then end-to-end
            calibration and tape extraction on a live NVIDIA B200 (Blackwell).
            Two independent manifest producers cross-checked clean; the extracted
            workload reported 109.274 M witness rows against the archived
            production record's 109.27 M.
          - >-
            Used measurement/model disagreement to identify and correct a faulty
            cross-shard communication abstraction, revising its per-sweep
            estimate from roughly 950 GB to 2.4--2.8 GB; upstreamed the corrected
            model, calibration suite, and machine profile. Current work extends
            the model and partitioning system toward 2--8-GPU proving; scaling
            results remain model-based, with end-to-end multi-device timing as
            the next empirical milestone.
      trusted-compute-verification:
        bullets:
          - >-
            Work on VerInf's ZK/prover side to establish operator-independent
            claims about frontier-model inference when the compute operator and
            its logs cannot be trusted. Built workload-manifest extraction,
            per-claim proving-cost instrumentation, an execution DAG, and a
            partition scorecard that make the claimed workload and dependencies
            explicit while correctness remains with a separate, small verifier.
          - >-
            Connected those claims to real execution through retrodiction against
            an archived full-scale Llama-4 Maverick proof and live NVIDIA B200
            calibration. Two independent manifest producers cross-checked with
            zero flags and reported 109.274 M witness rows against the archived
            record's 109.27 M; measurement also exposed and corrected a faulty
            cross-shard estimate from roughly 950 GB to 2.4--2.8 GB per sweep.
          - >-
            Current review-branch work partitions enrolled-weight computation
            without changing the proof bytes or verifier: sharded outputs were
            byte-identical and passed 4/4 acceptance gates on hardware, including
            the unmodified Rust verifier at two- and three-way cuts. No multi-GPU
            speedup has been measured; 2--8-GPU timing remains model-based pending
            end-to-end multi-device runs.
      gpu-inference-systems:
        bullets:
          - >-
            Built and upstreamed VerInf's dry-run profiler: operation-level
            workload manifests, a per-claim model of time, memory, bandwidth,
            and proof size, a claim-dependency DAG with critical-path and width
            analysis, and a partition scorecard for multi-accelerator proving.
          - >-
            Validated predictions against an archived full-scale Llama-4
            Maverick proof run, then ran end-to-end calibration and exact tape
            extraction on a live NVIDIA B200 (Blackwell). Independent manifest
            producers cross-checked with zero flags; 109{,}273{,}513 extracted
            witness rows matched the production record's 109.27 M.
          - >-
            Measurement/model disagreement exposed a faulty cross-shard
            communication abstraction; corrected its estimate from roughly 950
            GB to 2.4--2.8 GB per sweep. Implemented review-branch sharding with
            byte-identical outputs that passed 4/4 hardware gates, including the
            unmodified Rust verifier at two- and three-way cuts; no multi-GPU
            timing has been measured.
      software-engineering-systems:
        bullets:
          - >-
            Built and upstreamed VerInf's dry-run workload profiler,
            workload-manifest extraction, per-claim proving-cost model,
            execution DAG, and partition scorecard for a zero-knowledge LLM
            inference system; validated them against an archived full-scale
            Llama-4 Maverick proof and live NVIDIA B200 hardware.
          - >-
            Investigated measurement/model disagreement and corrected a faulty
            cross-shard communication abstraction, revising its estimate from
            roughly 950 GB to 2.4--2.8 GB per sweep. Current review-branch work
            implements verifier-transparent enrolled-weight sharding whose proof
            bytes match the single-device path and pass the unmodified Rust
            verifier; multi-GPU timing remains model-based.
      agent-platform-systems:
        bullets:
          - >-
            Built and upstreamed execution-analysis tooling for an LLM
            verification system: operation-level workload manifests, a model of
            time, memory, communication, and proof size, an execution DAG, and a
            partition scorecard. Validated it against an archived full-scale
            Llama-4 Maverick run and live NVIDIA B200 hardware.
          - >-
            Used measurement/model disagreement to diagnose a faulty cross-shard
            communication abstraction, correcting its estimate from roughly 950
            GB to 2.4--2.8 GB per sweep. Implemented verifier-transparent
            sharding with byte-identical outputs that passed the unmodified Rust
            verifier at two- and three-way cuts; multi-GPU timing remains
            model-based.
    links:
      - label: VerInf
        href: https://github.com/JamesPetrie/VerInf
      - label: Case study
        href: https://levineuwirth.org/essays/verified-inference/

