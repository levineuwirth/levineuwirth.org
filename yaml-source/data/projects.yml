  # ---------------------------------------------------------------------
  # Formal Verification & Assurance
  # ---------------------------------------------------------------------
  - id: proof-broker
    name: Proof Broker
    group: Formal Verification & Assurance
    start: "2026"
    end: Present
    description: "Routes proof goals from Lean 4 and Rocq through a shared intermediate representation to untrusted SMT solvers, automated theorem provers, and LLM provers, grades and checks the returned certificate, then reconstructs or replays it as a proof term the home kernel verifies. The R4 release closes 19 of 19 targeted obligations in an unmodified downstream Lean development, inside the sanctioned axiom ceiling, with generated evidence."
    presentation_sets:
      agent-platform-systems:
        description: >-
          Built a tool-execution boundary that routes Lean 4 and Rocq goals to
          untrusted SMT, automated, and LLM provers, grades and checks the
          returned certificates, and admits proofs only through the home
          system's small trusted kernel; 19 of 19 targeted obligations close
          in an unmodified downstream development.
    links:
      - label: Writeup
        href: /essays/proof-broker/
      - label: Source
        href: https://github.com/levineuwirth/proof-broker
      - label: Demo
        href: https://github.com/levineuwirth/proof-broker-demo
    cv_visible: false
    resume_visible: false
    web_visible: false # current-work page owns the public presentation
