overrides:
  experience:
    mars-v:
      bullets:
        - >-
          Integrated a collaborator's expert-weight bridge and repaired the
          verifier's enrollment, Merkle-opening and sumcheck-round checks.
          Added tests that require an explicit verdict from the Rust verifier.
        - >-
          Implemented and upstreamed enrolled-weight sharding. Two- and
          three-way splits on one GPU reproduced the unsharded proof byte for
          byte with fixed randomness and passed the existing verifier.
        - >-
          Repaired causal softmax, SiLU and surprisal constraints after
          protocol review. Earlier full-scale proofs do not verify under
          the repaired constraints.
