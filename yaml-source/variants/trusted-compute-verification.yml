summary: >-
  Systems and research engineer working on trustworthy AI execution across
  cryptography, formal verification, and systems. Current work develops
  zero-knowledge mechanisms and independently inspectable workload evidence for
  frontier-model inference, validated against an archived full-scale proof and
  live NVIDIA B200 hardware. Background includes trusted checking of untrusted
  provers, implementation-level cryptography, signed-authority distributed
  systems, low-level OS and networking work, and frontier-model evaluation.

