version: 1
extends: application-cv
abstract: false
description: Reusable CV for AI infrastructure, verification, accelerator-systems, and technical-assurance roles.
output: Levi-Neuwirth-CV-AI-Infra-Assurance.pdf
document_title: Research Engineer — AI Assurance \& Infrastructure
summary: >-
  Research engineer working on technical AI assurance across cryptography,
  systems, and model evaluation. Currently building and validating workload
  profilers, execution DAGs, accelerator calibration tooling, proving-cost
  models, and partition analyses for zero-knowledge verification of
  frontier-model inference. Background spans frontier-model evaluation and
  red-teaming, formal verification, low-level and distributed systems,
  cryptographic performance, and deployed ML research systems.

