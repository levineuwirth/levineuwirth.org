overrides:
  experience:
    shu-lab-undergrad:
      preamble: null
      bullets:
        - >-
          Built ML research systems at meaningful scale: co-led Deep Sets
          outcome models trained on 113M+ hospitalizations and deployed their
          public calculator; technical lead for NeuroPose's Python/TensorFlow
          inference and Rust-backed analysis platform across four externally
          funded sub-projects.

  projects:
    proof-broker:
      description: >-
        Routes Lean 4 and Rocq proof goals to untrusted SMT, automated, and LLM
        provers, then checks certificates and lifts proof terms into the home
        system's small trusted kernel; the Vampire path closes a goal end to end
        without adding axioms.
    pqc-avx2:
      label: Post-Quantum Cryptography / SIMD
      description: >-
        Profiled ML-KEM / Kyber on Brown's OSCAR cluster; hand-written x86-64
        AVX2 achieves 35--56× speedup for core NTT arithmetic and 5.4--7.1×
        end-to-end KEM speedup over compiler-optimized C, with a reproducible
        artifact and statistical analysis.
    weenix:
      description: >-
        Built and extended a 10{,}000-line Unix-like kernel in C: virtual
        memory, VFS and file systems, system calls, threading, device and
        interrupt handling, userspace x86-64 ELF support, pipes, and userspace
        preemption.
    networking-stack:
      description: >-
        Implemented TCP/IP, RIP, UDP, and DNS in Go for networks of up to eight
        virtual machines and 1 GB transfers; added a 2{,}000+-line,
        RFC-compliant SSH implementation supporting sustained sessions.

  skills:
    programming:
      items:
        - Python
        - Rust
        - C
        - C++
        - Go
        - "Assembly (x86-64, inline SIMD)"
    ml-ai:
      items:
        - PyTorch
        - TensorFlow
        - NumPy
    tools:
      label: Platforms and tooling
      items:
        - Git
        - Linux (Arch, Debian, Gentoo)
        - SLURM
        - perf
        - Docker
    verification:
      items:
        - Zero-knowledge proofs
        - ML-KEM / Kyber
        - Lean 4
        - Rocq
        - Vampire
