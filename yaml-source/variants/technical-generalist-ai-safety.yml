overrides:
  projects:
    pmacs:
      description: >-
        Built and released a Rust-cored, Lua-scripted editor at v1.1.0 with
        prebuilt binaries. Separated a long-lived async/process runtime from TUI
        and GPU frontends over a typed protocol; optional CRDT-backed buffers
        support concurrent editing.
    levcs:
      description: >-
        Built a federated version-control system in Rust (roughly 10 crates,
        194 tests) with signed Ed25519 authority chains, three storage modes, a
        crash-recoverable transaction journal, and a cascading
        textual/structural/wasm merge engine.
    proof-broker:
      description: >-
        Built a broker routing Lean 4 and Rocq goals to untrusted SMT,
        automated, and LLM provers, then checking certificates in the home
        system's small trusted kernel; the Vampire path closes a goal end to end
        without adding axioms.

