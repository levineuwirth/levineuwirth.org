version: 1
extends: application-cv
abstract: false
description: Reusable CV for frontier-model evaluation, control, monitoring, red-team, and technical-assurance roles.
output: Levi-Neuwirth-CV-Frontier-Evals-Control.pdf
document_title: Research Engineer — Frontier AI Evaluation \& Assurance
summary: >-
  Research engineer investigating whether claims about frontier AI systems
  hold under adversarial or uncertain conditions. Direct experience designing
  and running frontier-model evaluations, calibrating evaluators, debugging
  agent scaffolds, and analyzing capability, safety, reasoning, and red-team
  failures. Current work combines empirical investigation with cryptographic
  verification, formal methods, and systems research engineering.

