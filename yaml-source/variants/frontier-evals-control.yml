overrides:
  experience:
    mars-v:
      description: >-
        Worked on VerInf with James Petrie (Future of Life Institute).
        \href{https://www.anthropic.com/research/provable-inference}{Anthropic}
        cited VerInf's Llama 4 Maverick proof as prior work.
      bullets:
        - >-
          Built a Python workload profiler and checked two independent
          workload manifests against an archived Maverick run. Calibrated
          the cost model on an NVIDIA B200.
        - >-
          Integrated a collaborator's expert-weight bridge and repaired
          enrollment and verifier checks. Hardened the test harness so a
          crashed or silent verifier could no longer count as a rejection.
    shu-lab-undergrad:
      preamble: null
      bullets:
        - >-
          Co-developed readmission and mortality models and deployed their
          public calculator. On 3.23M held-out discharges, the readmission
          model scored 0.750 AUROC versus 0.655 for the Charlson index.
          Led NeuroPose's inference and analysis work across four funded projects.

  projects:
    proof-broker:
      label: '\href{https://levineuwirth.org/essays/eighty-witnesses-six-proofs/}{Proof Broker}'
      description: >-
        Built an OCaml broker that checks certificates from untrusted solvers.
        Evaluated model-generated proof certificates against a deterministic
        baseline on 15 fixed Lean obligations. The live workflow proved the
        same six obligations across eight draws. In a separate offline replay,
        the repaired checker validated all 36 retained certificates across four
        obligations without adding axioms.
    weenix:
      description: >-
        Built and extended a 10{,}000-line Unix-like kernel in C: virtual
        memory, VFS and file systems, system calls, threading, device and
        interrupt handling, userspace x86-64 ELF support, pipes, and userspace
        preemption.
    networking-stack:
      description: >-
        Implemented TCP/IP, RIP, UDP, and DNS in Go for networks of up to eight
        virtual machines and 1 GB transfers; added a 2{,}000+-line,
        RFC-compliant SSH implementation supporting sustained sessions.
    pqc-avx2:
      label: Post-Quantum Cryptography / SIMD
      description: >-
        Audited ML-KEM benchmarks comparing portable C and hand-written AVX2.
        Traced the original speedup estimates to measurements pooled across
        seven nodes and revised the analysis to compare run medians within each node.

  skills:
    programming:
      items:
        - Python
        - Rust
        - C
        - C++
        - Go
    verification:
      items:
        - Zero-knowledge proofs
        - Lean 4
        - Rocq
        - Vampire
    systems-performance:
      label: Systems and research engineering
      items:
        - Benchmarking and systems measurement
        - Distributed systems
    ml-ai:
      items:
        - PyTorch
        - TensorFlow
        - NumPy
    tools:
      label: Platforms and tooling
      items:
        - Git
        - Linux (Arch, Debian, Gentoo)
        - SLURM
        - Docker
