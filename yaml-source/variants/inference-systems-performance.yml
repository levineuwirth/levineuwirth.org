overrides:
  experience:
    mars-v:
      bullets:
        - >-
          Built a Python profiler that extracts workload manifests and an
          execution DAG to estimate proving costs. On an NVIDIA B200 it
          counted 109.27M witness rows for Llama 4 Maverick, matching the
          archived run to its reported precision.
        - >-
          Corrected estimated cross-shard traffic from roughly 950 GB to
          2.4--2.8 GB per sweep by accounting for local reductions.
        - >-
          Built a GPU cache for decoded weights. On the same B200 host and
          100-token workload, proving time fell from 1,891 to 1,787 seconds
          while peak GPU memory rose from 48 to 109 GiB.
  skills:
    ai-evaluation:
      label: ML correctness and evaluation
      items:
        - Frontier-model evaluation
        - Evaluation-environment design
        - Evaluator calibration
