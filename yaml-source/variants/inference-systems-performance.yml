summary: >-
  Systems and research engineer working across ML execution, accelerator
  performance, and correctness. Built a dry-run profiler and calibrated its
  cost model on an NVIDIA B200 to compare partition plans for verifiable
  frontier-model inference. Background includes low-level cryptographic
  optimization, distributed systems, frontier-model evaluation, and formal
  verification.

