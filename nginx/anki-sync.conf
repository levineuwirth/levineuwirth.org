# anki.levineuwirth.org — the Anki sync server behind TLS.
#
# Install: the port-80 server first (so the ACME challenge can be answered),
# `certbot certonly --nginx -d anki.levineuwirth.org`, then this whole file
# to /etc/nginx/sites-available/anki-sync.conf, symlinked into sites-enabled,
# with nginx/anki-sync-zone.conf in conf.d/; `nginx -t && systemctl reload nginx`.
# The certificate paths are explicit so certbot never rewrites this file;
# its renewal timer renews the certificate in place.
#
# What differs from a website vhost, and why:
#   - a full sync uploads a whole collection with media in one request over
#     whatever link the phone has: large body, long timeouts, no buffering
#   - the only credential-guessing surface is /sync/hostKey; everything
#     else is a burst of small authenticated requests (media sync), so the
#     rate limit applies to that one location and nowhere else
#   - none of the website's header snippets: this is an API, and CSP /
#     framing headers mean nothing to an Anki client
#   - TLS 1.2 stays enabled: AnkiMobile (iOS) needs it
#
# http { } scope, once: see nginx/anki-sync-zone.conf.

server {
    listen 80;
    listen [::]:80;
    server_name anki.levineuwirth.org;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name anki.levineuwirth.org;

    ssl_certificate     /etc/letsencrypt/live/anki.levineuwirth.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anki.levineuwirth.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;   # certbot's ciphers; TLS 1.2 stays enabled for AnkiMobile

    access_log /var/log/nginx/anki-sync.access.log;
    error_log  /var/log/nginx/anki-sync.error.log;

    client_max_body_size 256m;          # >= MAX_SYNC_PAYLOAD_MEGS in server.env
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /sync/hostKey {
        limit_req zone=anki_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080/;   # trailing slash: the manual insists
    }
}
