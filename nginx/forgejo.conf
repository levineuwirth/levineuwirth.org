# forgejo.conf — git.levineuwirth.org, the Forgejo instance behind TLS.
# Installed at /etc/nginx/sites-available/forgejo.conf, symlinked into
# sites-enabled; nginx/README.md has the steps.
#
# Until 2026-10-03 this block lived inline in /etc/nginx/nginx.conf, in
# neither the repo nor any backup (audit Y13). Moving it here also gave it
# HTTP/2 and the transport headers the forge lacked (audit W06): HSTS
# reached git. only through the apex's includeSubDomains, and only for a
# browser that had visited the apex within the year, so a first visit to
# the login page from a CV link had none.

server {
    listen 443 ssl;
    http2  on;
    listen [::]:443 ssl;

    server_name git.levineuwirth.org;
    access_log /var/log/nginx/forgejo.access.json.log access_json buffer=64k flush=5s;

    ssl_certificate     /etc/letsencrypt/live/git.levineuwirth.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/git.levineuwirth.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # nginx's, not Forgejo's: hidden from the upstream, so a Forgejo release
    # that starts sending one of them cannot produce a second, different
    # copy. Forgejo keeps its own X-Frame-Options and cookie flags.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    # Pushing a large repository over HTTP is one big request.
    client_max_body_size 512M;

    # Source archives are off in Forgejo (DISABLE_DOWNLOAD_SOURCE_ARCHIVES,
    # forgejo/docker-compose.yml), but 15.0 still serves them on the API.
    location ~ ^/api/v1/repos/[^/]+/[^/]+/archive/ {
        return 404;
    }

    location / {
        # Anubis filters HTTP only; Forgejo's SSH port and the updater's
        # localhost health check still reach Forgejo directly.
        proxy_pass http://127.0.0.1:8923;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite the entire chain: no client-supplied forwarding header
        # may choose the address used for challenges or seen by Forgejo.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-TLS-SNI-Name $ssl_server_name;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Uri "";
        proxy_set_header X-Anubis-Rule "";
        proxy_set_header X-Anubis-Action "";
        proxy_set_header X-Anubis-Status "";
        # Large Git pushes need streaming and time for Forgejo to process.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}

# HTTP → HTTPS, in a location so a renewal's ACME challenge matches first.
server {
    listen 80;
    listen [::]:80;
    server_name git.levineuwirth.org;
    access_log /var/log/nginx/forgejo.access.json.log access_json buffer=64k flush=5s;
    location / {
        return 301 https://$host$request_uri;
    }
}
