# security-headers.conf — security baseline for the levineuwirth.org vhost.
#
# Place at /etc/nginx/snippets/security-headers.conf and `include` it
# inside the server { } block of the vhost, alongside the other
# snippets shipped from this repo:
#
#   server {
#       server_name levineuwirth.org;
#       root /var/www/levineuwirth.org;
#       ...
#       include snippets/security-headers.conf;
#       include snippets/security-framing.conf;
#       include snippets/csp-report.conf;
#       include snippets/static-assets.conf;
#       include snippets/popup-proxy.conf;
#       include snippets/archive.conf;
#   }
#
# The framing directives (X-Frame-Options / frame-ancestors) deliberately
# live in security-framing.conf, NOT here — see that file for why. Any
# location that declares its own add_header must re-include BOTH
# snippets to keep the full baseline.

# Hide the nginx version from error pages and the Server header.
server_tokens off;

# HSTS — one year, with subdomains, preload-eligible. Only safe to
# enable once HTTPS is the only listener (the :80 vhost should already
# 301 → https). Once preload is requested via hstspreload.org, the
# max-age cannot be lowered without removing from the list manually.
add_header Strict-Transport-Security
    "max-age=31536000; includeSubDomains; preload" always;

# Block MIME-sniffing — required for safe text/plain and svg responses.
add_header X-Content-Type-Options "nosniff" always;

# Strip the Referer header to "scheme + host" on cross-origin requests.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Default-deny powerful APIs. (interest-cohort, FLoC's opt-out, was
# dropped 2026-10-02: browsers no longer know the feature and some log an
# "unrecognized feature" error for it on every page.)
add_header Permissions-Policy
    "camera=(), microphone=(), geolocation=()" always;

# ── Content Security Policy ─────────────────────────────────────────
#
# Two Report-Only policies, each with `report-uri /csp-report` (the
# collector in csp-report.conf, included once at server { } level). A
# browser evaluates and reports every policy independently, and each
# report carries its policy text in `original-policy`, so the log says
# which one a violation came from.
#
#   1. The ENFORCING CANDIDATE, verbatim minus `upgrade-insecure-requests`
#      (which does nothing in Report-Only and only draws a console
#      warning). Promotion is reviewed on 2026-10-08 (forgejo/UPGRADE.md
#      § 9.5): the criterion is that the browser checks pass and every
#      remaining report is explained, not that there are none. Two
#      reports per semantic-search session are known and benign:
#      transformers.js probes `eval` once and carries on without it.
#   2. The same policy with cdn.jsdelivr.net narrowed to the four pinned
#      packages the templates load (audit W09: a bare jsDelivr origin
#      admits every package on npm). Measured only; a later promotion.
#
# Changes on 2026-10-02 (audit 2026-10-01: A01, A17, J18, W09):
#   - img-src gains `blob:`. PDF.js draws its sidebar thumbnails and its
#     print output as <img src="blob:…">; production already reported it.
#     Only same-origin script can mint a blob: URL. It cannot be scoped
#     to /pdfjs/: that location re-includes this file, and two CSP
#     headers only ever intersect.
#   - img-src gains thumb.wikimedia.org, where Wikipedia's pageimages
#     thumbnails (the lead image of a Wikipedia popup) now come from.
#   - 'unsafe-eval' becomes 'wasm-unsafe-eval'. WebAssembly compilation is
#     all that Pagefind, onnxruntime-web and PDF.js need; no page loads
#     Vega today, and if one returns, vega-embed's `ast: true` with
#     vega-interpreter runs without eval. Tested enforcing on 42 routes in
#     Chromium and Firefox. Needs Safari 16 or later.
#   - worker-src is left out, so workers fall back to script-src. The old
#     candidate pre-approved `worker-src 'self' blob:` for semantic search
#     and Pagefind; measured, neither makes a blob: worker (Pagefind's
#     worker is same-origin, transformers.js starts none without
#     cross-origin isolation). If one ever does, policy 1 reports it.
#
# External origins:
#   cdn.jsdelivr.net               Vega, Vega-Lite, Vega-Embed; transformers.js,
#                                  whose onnxruntime fetches its .wasm from
#                                  its own dist/ (-> connect-src)
#   *.basemaps.cartocdn.com        Leaflet basemap tiles (photography map)
#   upload/thumb.wikimedia.org     Wikipedia popup lead images
#   connect-src API hosts          link-popup providers fetched directly via
#                                  CORS. The CORS-broken trio (arxiv,
#                                  archive.org, pubmed) goes through the
#                                  same-origin /proxy/ (popup-proxy.conf).
#
# KaTeX is self-hosted under /katex/ (audit X6), so policy 2 no longer
# names it; install this after the site deploy that moves it, or the live
# pages' CDN KaTeX reports against policy 2 until then.
#
# Why 'unsafe-inline' on style: photography.html emits
# <span style="background:$swatch$"> for palette swatches (data-driven,
# can't be hashed), and KaTeX adds inline styles when it renders.
#
# Each value MUST stay on one physical line: nginx has no line
# continuation inside quoted strings — a trailing backslash would embed
# literal backslash + LF bytes in the header value, which is illegal in
# HTTP/2 and gets whole responses rejected by strict clients.
#
# ── Promotion ───────────────────────────────────────────────────────
# Swap policy 1 for the enforcing line below (and keep policy 2 as
# Report-Only until it, too, is explained). Re-test math, both search
# tabs, the photography map, every popup provider, the PDF.js viewer
# (thumbnails and print), and an archive snapshot page before and after.
#
#   add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://upload.wikimedia.org https://thumb.wikimedia.org; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://*.wikipedia.org https://api.crossref.org https://api.github.com https://openlibrary.org https://api.biorxiv.org https://www.youtube.com https://git.levineuwirth.org; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri /csp-report" always;
#
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://upload.wikimedia.org https://thumb.wikimedia.org; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://*.wikipedia.org https://api.crossref.org https://api.github.com https://openlibrary.org https://api.biorxiv.org https://www.youtube.com https://git.levineuwirth.org; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /csp-report" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net/npm/vega@5.33.1/ https://cdn.jsdelivr.net/npm/vega-lite@5.23.0/ https://cdn.jsdelivr.net/npm/vega-embed@6.29.0/ https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2 https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://upload.wikimedia.org https://thumb.wikimedia.org; font-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/ https://*.wikipedia.org https://api.crossref.org https://api.github.com https://openlibrary.org https://api.biorxiv.org https://www.youtube.com https://git.levineuwirth.org; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /csp-report" always;
