# security-headers.conf — security baseline for the levineuwirth.org vhost.
#
# Place at /etc/nginx/snippets/security-headers.conf and `include` it
# inside the server { } block of the vhost, alongside the other
# snippets shipped from this repo:
#
#   server {
#       server_name levineuwirth.org;
#       root /var/www/levineuwirth.org;
#       ...
#       include snippets/security-headers.conf;
#       include snippets/security-framing.conf;
#       include snippets/csp-report.conf;
#       include snippets/static-assets.conf;
#       include snippets/popup-proxy.conf;
#       include snippets/archive.conf;
#   }
#
# The framing directives (X-Frame-Options / frame-ancestors) deliberately
# live in security-framing.conf, NOT here — see that file for why. Any
# location that declares its own add_header must re-include BOTH
# snippets to keep the full baseline.

# Hide the nginx version from error pages and the Server header.
server_tokens off;

# HSTS — one year, with subdomains, preload-eligible. Only safe to
# enable once HTTPS is the only listener (the :80 vhost should already
# 301 → https). Once preload is requested via hstspreload.org, the
# max-age cannot be lowered without removing from the list manually.
add_header Strict-Transport-Security
    "max-age=31536000; includeSubDomains; preload" always;

# Block MIME-sniffing — required for safe text/plain and svg responses.
add_header X-Content-Type-Options "nosniff" always;

# Strip the Referer header to "scheme + host" on cross-origin requests.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Default-deny powerful APIs. interest-cohort opts out of FLoC/Topics.
add_header Permissions-Policy
    "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# ── Content Security Policy ─────────────────────────────────────────
#
# Still shipped Report-Only, but no longer blind: `report-uri /csp-report`
# points at the collector defined in csp-report.conf, which must be
# included once at server { } level for the reports to land anywhere.
# Without a report destination the Report-Only header produced no
# operational signal at all (audit S05) — browser-console messages on the
# author's own machine are not a report stream.
#
# `upgrade-insecure-requests` has been REMOVED: the directive has no
# effect in a Report-Only policy and browsers log a warning for it
# (also audit S05). It belongs only in the enforcing variant below, and
# even there it is redundant while every subresource URL is already
# https:// or root-relative. HSTS above already forecloses http:// for
# this origin.
#
# External origins justified inline:
#   cdn.jsdelivr.net               KaTeX CSS + JS + webfonts (the KaTeX CSS
#                                  references its fonts relatively, so they
#                                  resolve to the CDN -> font-src), Vega /
#                                  Vega-Lite / Vega-Embed, transformers.js
#                                  (whose onnxruntime fetches its .wasm from
#                                  the CDN via fetch() -> connect-src)
#   *.basemaps.cartocdn.com        Leaflet basemap tiles (photography map only,
#                                  static/js/photography-map.js:29)
#   upload.wikimedia.org           Wikipedia pageimages thumbnails shown as the
#                                  lead image of a Wikipedia link popup
#                                  (static/js/popups.js:648)
#   connect-src API hosts          link-popup providers fetched directly via
#                                  CORS (the list popups.js documents in its
#                                  header, plus git.levineuwirth.org for the
#                                  Forgejo provider). The CORS-broken trio
#                                  (arxiv, archive.org, pubmed) goes through
#                                  the same-origin /proxy/ instead — see
#                                  nginx/popup-proxy.conf.
#
# Why 'unsafe-inline' on style:
#   - photography.html emits <span style="background:$swatch$"> for
#     palette swatches (data-driven, can't be hashed).
#   - KaTeX adds inline styles when rendering math at runtime.
#
# Why 'unsafe-eval' on script:
#   - vega-embed compiles Vega-Lite specs at runtime via new Function().
#     Removing this would require pre-compiling specs at build time.
#   - it also covers WebAssembly.instantiate for onnxruntime-web
#     (semantic search) and Pagefind's wasm index.
#
#   It CANNOT be narrowed here. The pages that need it are selected by
#   the build-time capability flags in templates/partials/head.html
#   ($if(viz)$, $if(search)$, $if(math)$), and those flags leave no trace
#   in the URL path, which is the only thing nginx can key a header on.
#   Narrowing it needs a per-page policy emitted by the template — a
#   <meta http-equiv="Content-Security-Policy"> in head.html, guarded by
#   the same flags — which is a build-side change, not an nginx one.
#   (`frame-ancestors`, `report-uri` and sandbox are ignored in <meta>,
#   so the meta policy must be additive to this header, not a copy.)
#
# The value MUST stay on one physical line: nginx has no line
# continuation inside quoted strings — a trailing backslash would embed
# literal backslash + LF bytes in the header value, which is illegal in
# HTTP/2 and gets whole responses rejected by strict clients.
#
# ── Promotion path ──────────────────────────────────────────────────
# Once /var/log/nginx/csp-report.log has been quiet for a week, swap the
# active line for the enforcing one below. Do NOT promote the Report-Only
# value verbatim: it has not been shown to cover the Web Worker and
# blob: usage of onnxruntime-web (semantic search) or Pagefind, which
# report-only mode never had to exercise. The enforcing candidate adds
# `worker-src 'self' blob:` for exactly that reason — deliberately
# absent from the Report-Only line below, so that any such use shows up
# in the report stream instead of being pre-approved unmeasured. Re-test math, both
# search tabs, the photography map, every popup provider, the PDF.js
# viewer, and an archive snapshot page before and after the swap.
#
#   add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://*.basemaps.cartocdn.com https://upload.wikimedia.org; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://*.wikipedia.org https://api.crossref.org https://api.github.com https://openlibrary.org https://api.biorxiv.org https://www.youtube.com https://git.levineuwirth.org; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri /csp-report" always;
#
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://*.basemaps.cartocdn.com https://upload.wikimedia.org; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://*.wikipedia.org https://api.crossref.org https://api.github.com https://openlibrary.org https://api.biorxiv.org https://www.youtube.com https://git.levineuwirth.org; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /csp-report" always;
