# http {} scope; loaded before the vhosts. Original path, without query
# parameters, survives rewrites and the internal redirect to /404.html.
map $request_uri $log_path {
    ~^([^?]*) $1;
    default "";
}

# Keep the referring host, not private paths/query strings or URL credentials.
map $http_referer $log_referer_host {
    ~^https?://([^/@?#]+)(?:[/?#]|$) $1;
    default "";
}

# Successful assets under one second are omitted. All other outcomes,
# including client disconnects (499), are retained. Page and API logs
# are unfiltered. $request_time includes time spent sending to the client.
map "$status:$request_time" $log_asset {
    ~^[23][0-9][0-9]:0[.][0-9]+$ 0;
    default 1;
}

# One JSON object per completed request. Optional upstream values are
# strings: they can be empty or contain multiple attempts, not one number.
# No request body, Authorization, Cookie, or query string is recorded.
log_format access_json escape=json
    '{"time":"$time_iso8601","time_unix":$msec,"request_id":"$request_id",'
    '"nginx_pid":"$pid","connection":"$connection","connection_requests":$connection_requests,'
    '"remote_addr":"$remote_addr","host":"$host","vhost":"$server_name",'
    '"scheme":"$scheme","protocol":"$server_protocol",'
    '"method":"$request_method","path":"$log_path",'
    '"status":$status,"bytes_sent":$bytes_sent,"request_length":$request_length,'
    '"request_time":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"cache_status":"$upstream_cache_status",'
    '"encoding":"$sent_http_content_encoding",'
    '"limit_req_status":"$limit_req_status",'
    '"tls_protocol":"$ssl_protocol","tls_cipher":"$ssl_cipher",'
    '"accept_language":"$http_accept_language",'
    '"sec_fetch_site":"$http_sec_fetch_site","sec_fetch_mode":"$http_sec_fetch_mode",'
    '"sec_fetch_dest":"$http_sec_fetch_dest",'
    '"referer_host":"$log_referer_host","ua":"$http_user_agent"}';
