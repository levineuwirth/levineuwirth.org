# static-assets.conf — Compression + cache headers for static assets.
#
# Place at /etc/nginx/snippets/static-assets.conf and `include` it inside
# the server { } block of the levineuwirth.org vhost:
#
#   server {
#       server_name levineuwirth.org;
#       root /var/www/levineuwirth.org;
#       ...
#       include snippets/security-headers.conf;
#       include snippets/security-framing.conf;
#       include snippets/static-assets.conf;
#       include snippets/popup-proxy.conf;
#   }
#
# Pairs with tools/compress-assets.sh, which pre-generates .gz and .br
# sidecars at build time so nginx never pays the compression cost at
# request time.

# ── On-the-fly gzip (fallback) ───────────────────────────────────────
# Covers dynamically generated responses and any file for which a .gz
# sidecar was not produced (e.g. files smaller than compress-assets.sh's
# MIN_SIZE threshold, or extensions not on its allow-list).
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   256;
gzip_proxied      any;
gzip_types        text/plain
                  text/css
                  text/xml
                  application/javascript
                  text/javascript
                  application/json
                  application/xml
                  application/xml+rss
                  application/wasm
                  image/svg+xml;

# ── Pre-compressed sidecars ──────────────────────────────────────────
# Serve <file>.gz / <file>.br when the client advertises a matching
# Accept-Encoding. Zero request-time CPU; maximum compression ratio
# because the sidecars were produced with gzip -9 / brotli -Z.
gzip_static       on;

# brotli_static requires the ngx_brotli module:
#   Arch:   pacman -S nginx-mod-brotli  (or build nginx-mainline with the module)
#   Debian/Ubuntu: apt install libnginx-mod-brotli
# If the module is absent, comment out the two brotli lines below; gzip_static
# will still cover every modern browser. Chromium/Firefox/Safari all accept gzip.
brotli_static     on;
brotli            off;   # we ship pre-compressed sidecars only, no on-the-fly brotli

# ── Cache headers ────────────────────────────────────────────────────
#
# NONE of these paths is fingerprinted. `/pdfjs/…`, `/fonts/…` and
# `/models/…` are stable URLs whose CONTENTS change whenever the pinned
# version in tools/download-pdfjs.sh, the font file, or the embedding
# model is replaced. `immutable` promises the exact opposite — that the
# bytes at this URL will never change — so a warm client kept the old
# viewer, font, or model for up to a year after a deploy (audit S06).
# Pinning a dependency's version in a build script does not fingerprint
# its public URL.
#
# So: `immutable` is gone everywhere, and each path gets a freshness
# window proportional to how expensive revalidation is. `must-revalidate`
# forbids serving the entry once stale without asking, which keeps a
# replaced asset from lingering behind a flaky network.
#
# FOLLOW-UP (the real fix): emit content-hashed URLs and rewrite the
# references, then `immutable` becomes correct and the windows can go
# back to a year.
#   - /pdfjs/  -> /pdfjs/<PDFJS_VERSION>/…, version already known to
#                 tools/download-pdfjs.sh and to build/Filters/EmbedPdf.hs.
#   - /fonts/  -> /fonts/<name>.<sha256-8>.woff2, rewritten in the CSS at
#                 build time.
#   - /models/ -> /models/<model>@<revision>/…, the revision is already
#                 recorded by tools/embed.py.
# Until then a stale asset costs one conditional request, not a year.
#
# `always` is deliberately ABSENT from every Cache-Control below.
# Without it, add_header applies only to 200, 201, 204, 206, 301, 302,
# 303, 304, 307 and 308 (nginx.org/en/docs/http/ngx_http_headers_module.html
# #add_header). With it, a 404 for a mistyped or deleted asset was being
# handed a long-lived Cache-Control and cached as a negative result
# (audit P06) — a missing stylesheet stayed missing for an hour of
# wall-clock time even after it was restored. The security headers keep
# `always`, because those must reach error responses too.

location ^~ /pdfjs/ {
    # Re-include the security baseline: this location declares its
    # own add_header, which (per nginx inheritance rules) would
    # otherwise drop HSTS/nosniff/CSP for everything it serves —
    # and nosniff matters most on exactly these JS/CSS responses.
    # Same pattern as archive.conf.
    include snippets/security-headers.conf;

    # Framing EXCEPTION (audit S07). security-framing.conf is
    # deliberately NOT included here. build/Filters/EmbedPdf.hs emits a
    # same-origin <iframe src="/pdfjs/web/viewer.html?file=…"> for
    # published {{pdf:…}} blocks, and the site-wide X-Frame-Options:
    # DENY made every browser refuse to display it. These two lines are
    # the whole framing policy for this subtree — one coherent pair,
    # not a second header layered on top of a conflicting one:
    #   - SAMEORIGIN / 'self' still block every third-party embed;
    #   - frame-ancestors is enforcing (not Report-Only) so it actually
    #     decides, and a policy containing only frame-ancestors places
    #     no other restriction on the viewer.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # One week. The viewer is version-pinned in tools/download-pdfjs.sh,
    # so it changes only on a deliberate bump; a week bounds how long a
    # warm client can keep the previous viewer against the current
    # worker, which is the failure that B12 describes.
    add_header Cache-Control "public, max-age=604800, must-revalidate";
    access_log off;
}

location ^~ /fonts/ {
    # Keep the security baseline (see first location above). Framing
    # stays at the site default here.
    include snippets/security-headers.conf;
    include snippets/security-framing.conf;

    # One week. Fonts are small, revalidation is a 304, and a replaced
    # face should not survive a year at an unchanged filename.
    add_header Cache-Control "public, max-age=604800, must-revalidate";
    access_log off;
}

location ^~ /models/ {
    # Keep the security baseline (see first location above).
    include snippets/security-headers.conf;
    include snippets/security-framing.conf;

    # Thirty days. The model weights are ~23 MB, so this is the one
    # place where a long window genuinely pays for itself — and
    # revalidating it still costs only a conditional request, never a
    # re-download, because `must-revalidate` yields a 304 when the
    # weights are unchanged. Config/tokenizer/weights all sit under this
    # prefix and therefore expire together, which is what keeps them on
    # one consistent release.
    add_header Cache-Control "public, max-age=2592000, must-revalidate";
    access_log off;
}

# Per-extension caching for assets that live alongside HTML. CSS and JS
# in this repo are not fingerprinted, so a 1-hour cache with must-revalidate
# keeps them responsive to deploys (~1h staleness window for warm clients)
# without forcing a fetch on every page navigation.
location ~* \.(?:css|js|mjs|woff2?|svg|webp|png|jpg|jpeg|ico)$ {
    # Keep the security baseline (see first location above).
    include snippets/security-headers.conf;
    include snippets/security-framing.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    access_log off;
}
