# popup-proxy.conf — same-origin reverse proxy for the three popups.js
# providers whose upstream APIs do not send CORS headers (arXiv,
# NCBI/PubMed, Internet Archive). All three return immutable metadata,
# so the cache TTL is generous; a manual `proxy_cache_purge` is
# unnecessary.
#
# Place this file at /etc/nginx/snippets/popup-proxy.conf and `include`
# it inside the server { } block of the levineuwirth.org vhost. The
# `proxy_cache_path` directive must live in the http { } context — put
# it in nginx.conf or the relevant conf.d/ file.
#
#   http {
#       proxy_cache_path /var/cache/nginx/popup-proxy
#                        levels=1:2 keys_zone=popup_proxy:16m
#                        max_size=512m inactive=60d use_temp_path=off;
#       limit_req_zone $binary_remote_addr zone=pubmed:1m rate=3r/s;
#       ...
#   }
#
#   server {
#       server_name levineuwirth.org;
#       ...
#       include snippets/popup-proxy.conf;
#   }
#
# ── Allow-list, not a proxy (audit S03) ──────────────────────────────
#
# This file used to accept ANY suffix under /proxy/arxiv/,
# /proxy/arxiv-html/, /proxy/archive/ and /proxy/pubmed/ and hand it to
# the upstream verbatim. That turned three metadata endpoints into an
# open window onto three entire websites, served under this origin: e.g.
# /proxy/archive/details/texts returned archive.org's full HTML browse
# page as levineuwirth.org, with the upstream's own enforcing CSP
# stripped off on the way through. Every location below is now
# restricted to the exact URL shapes static/js/popups.js actually emits,
# and everything else under /proxy/ answers 404.
#
# The four shapes, and where popups.js produces them:
#
#   static/js/popups.js:694   /proxy/arxiv/api/query?id_list=<id>
#   static/js/popups.js:719   /proxy/arxiv-html/<id>
#   static/js/popups.js:737   /proxy/arxiv-html/<id>/<figure>.<img-ext>
#   static/js/popups.js:887   /proxy/archive/metadata/<identifier>
#   static/js/popups.js:911   /proxy/pubmed/entrez/eutils/esummary.fcgi
#                                 ?db=pubmed&id=<pmid>&retmode=json
#
# Shape checks use `if (...) { return 404; }`, which is the one form the
# nginx authors document as safe inside a location, rather than regex
# `location ~` blocks. Regex locations are matched in file order across
# the whole server, so a `location ~ ^/proxy/arxiv-html/…\.png$` here
# would lose to the per-extension regex in static-assets.conf whenever
# that snippet is included first — silently 404ing every arXiv figure.
# `^~` prefix locations short-circuit regex evaluation entirely, so the
# guard below is correct no matter what order the snippets are included
# in. `location =` (exact) outranks everything and needs no `^~`.
#
# nginx normalises the request URI — percent-decoding, `.`/`..`
# resolution and slash merging — before location matching, so $uri here
# is already decoded and traversal-free; $args is NOT decoded, which is
# why the id_list pattern below matches the literal %2F that
# encodeURIComponent() produces for old-style arXiv identifiers.

# Shared resolver — needed because proxy_pass uses a variable upstream
# (literal upstreams are resolved once at startup; variables defer DNS
# to request time, which lets nginx start without the upstream being
# reachable and survives upstream IP changes).
resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
resolver_timeout 5s;

# ── arXiv Atom API ───────────────────────────────────────────────────
# Paper metadata. Abstracts never change after publication (revisions get
# distinct IDs like 2604.06217v2), so 30d is safe.
#
# Exact-match location: this is the only path popups.js asks for on this
# upstream. `location =` also outranks every regex location in the
# server, so the `^~` the other blocks need is unnecessary here.
location = /proxy/arxiv/api/query {
    # GET/HEAD only. `limit_except GET` would answer 403; 404 keeps the
    # whole /proxy/ tree indistinguishable from a path that does not exist.
    if ($request_method !~ "^(?:GET|HEAD)$") { return 404; }

    # The single argument popups.js sends (popups.js:694-695), in the two
    # identifier forms its `match` regex can capture (popups.js:687):
    #   new style  2403.12345          \d{4}\.\d{4,5}
    #   old style  math.GT/0211159     encodeURIComponent -> math.GT%2F0211159
    # The trailing vN is stripped client-side before the request, so no
    # version suffix is accepted here.
    if ($args !~ "^id_list=(?:\d{4}\.\d{4,5}|[a-z][a-z-]*(?:\.[A-Z]{2})?%2[Ff]\d{7})$") { return 404; }

    set $upstream_arxiv export.arxiv.org;
    # With a VARIABLE upstream, a URI part on proxy_pass is passed to
    # the upstream literally — "proxy_pass https://$up/;" sends every
    # request to the upstream's homepage instead of prefix-stripping.
    # Strip the prefix explicitly; `break` keeps args intact.
    rewrite ^/proxy/arxiv/(.*)$ /$1 break;
    proxy_pass https://$upstream_arxiv;
    proxy_set_header Host $upstream_arxiv;
    proxy_set_header User-Agent "levineuwirth.org popup-proxy (ln@levineuwirth.org)";

    # Upstream TLS (audit S04). proxy_ssl_server_name is SNI only — it
    # says which name to ask for, not that the answer must match. Without
    # proxy_ssl_verify, nginx accepts ANY certificate, and a DNS or
    # on-path compromise could plant a response that this proxy then
    # caches for 30 days and serves under this origin.
    #   Debian/Ubuntu and Arch both ship the bundle at this path
    #   (Debian: ca-certificates; Arch: ca-certificates-utils).
    #   Fedora/RHEL use /etc/pki/tls/certs/ca-bundle.crt instead.
    proxy_ssl_server_name        on;
    proxy_ssl_name               $upstream_arxiv;
    proxy_ssl_verify             on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth       2;

    # Clear request credentials at the boundary. The visitor's cookies for
    # levineuwirth.org (and anything an extension attaches) have no business
    # reaching a third-party API, and a Set-Cookie coming back would
    # otherwise be written into the shared proxy cache and replayed to
    # every later visitor.
    proxy_set_header Cookie        "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;

    # Keep the security baseline: the add_header directives below
    # would otherwise drop it for /proxy/ responses (same pattern
    # as archive.conf). The upstream's own security headers are hidden
    # first — browsers honor only the FIRST Strict-Transport-Security
    # header (RFC 6797 §8.1), so an upstream's short max-age passing
    # through ahead of ours would downgrade the domain's cached HSTS
    # policy on every popup fetch.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Robots-Tag;
    include snippets/security-headers.conf;
    include snippets/security-framing.conf;

    # Proxied third-party metadata must never enter the index under this
    # domain: it is not this site's content, and a proxied URL that got
    # indexed would advertise the proxy itself.
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_cache popup_proxy;
    proxy_cache_valid 200 30d;
    proxy_cache_valid any  5m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status always;

    # Belt-and-suspenders: even though same-origin doesn't need CORS, a
    # future migration of popups.js to a worker or different origin would.
    add_header Access-Control-Allow-Origin "$scheme://$host" always;
}

# ── arXiv HTML renditions (lead figures) ─────────────────────────────
# popups.js's arXiv enrich step fetches the LaTeXML HTML page to find
# the paper's lead figure, then loads the figure image itself — both
# through this location. Upstream is arxiv.org proper, NOT
# export.arxiv.org: the export host serves the Atom API fine but
# rate-limits the /html/ asset tree (429s on figures). Pages can be
# large (hundreds of KB), which is exactly why they're cached here.
# A 404 is the common no-HTML-rendition case (pre-2024 papers,
# unconvertible sources) — cached briefly so hovers don't hammer it.
location ^~ /proxy/arxiv-html/ {
    if ($request_method !~ "^(?:GET|HEAD)$") { return 404; }

    # No query string is ever sent to this location.
    if ($args) { return 404; }

    # Two shapes only, and they share one pattern:
    #   the page      /proxy/arxiv-html/2410.21276          (popups.js:719)
    #   a figure      /proxy/arxiv-html/2410.21276v1/assets/x.png
    # The figure form is what popups.js:737 reconstructs after resolving
    # the img src relative to the fetched page — upstream emits srcs like
    # "2410.21276v1/assets/Evaluating-Text-Tasks.png". Only image
    # extensions are allowed, so the HTML page's stylesheets, scripts and
    # fonts cannot be pulled through this proxy.
    #
    # Old-style identifiers (math.GT/0211159) are deliberately NOT
    # accepted: arXiv's LaTeXML tree only covers roughly 2024 onwards, so
    # those always 404 upstream anyway. popups.js treats a non-ok
    # response as "no figure" (popups.js:721), so the visible behaviour
    # is unchanged and the round trip is saved.
    if ($uri !~ "^/proxy/arxiv-html/\d{4}\.\d{4,5}(?:v\d+)?(?:/[A-Za-z0-9._/-]{1,200}\.(?:png|jpe?g|gif|svg|webp))?$") { return 404; }

    set $upstream_arxiv_site arxiv.org;
    rewrite ^/proxy/arxiv-html/(.*)$ /html/$1 break;
    proxy_pass https://$upstream_arxiv_site;
    proxy_set_header Host $upstream_arxiv_site;
    proxy_set_header User-Agent "levineuwirth.org popup-proxy (ln@levineuwirth.org)";

    # Upstream TLS verification — see the arXiv Atom block for the
    # rationale and the per-distribution CA bundle paths.
    proxy_ssl_server_name        on;
    proxy_ssl_name               $upstream_arxiv_site;
    proxy_ssl_verify             on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth       2;

    proxy_set_header Cookie        "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header Content-Disposition;
    include snippets/security-headers.conf;

    # ── The one location that unavoidably returns third-party HTML ──
    # This is the whole framing/execution policy for this subtree
    # (security-framing.conf is deliberately NOT included; these lines
    # replace it, so there is exactly ONE Content-Security-Policy header
    # here rather than two that have to be reasoned about together).
    #
    # `sandbox` with no tokens drops the response into an opaque origin
    # with scripting, forms, popups and same-origin access all disabled;
    # `default-src 'none'` stops it pulling any subresource. Together
    # they mean that a visitor who navigates DIRECTLY to
    # /proxy/arxiv-html/<id> gets an inert document that cannot run
    # script as levineuwirth.org — which is the S03 exposure — while
    # popups.js is untouched, because it reads the page with fetch() and
    # DOMParser (popups.js:719-725) and a DOMParser document is inert by
    # construction and never has a CSP applied to it. The CSP is likewise
    # inert on the figure images: sandbox and the fetch directives apply
    # to documents and workers, not to an <img> subresource.
    #
    # It is ENFORCING, not Report-Only. The site-wide policy is still
    # Report-Only because it has not been proven complete; this one is
    # complete by construction — it permits nothing.
    add_header Content-Security-Policy "sandbox; default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Disposition "inline" always;

    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_cache popup_proxy;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1d;
    proxy_cache_valid any 5m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status always;

    add_header Access-Control-Allow-Origin "$scheme://$host" always;
}

# ── Internet Archive ─────────────────────────────────────────────────
# Item metadata JSON. Item descriptions are author-edited and could
# change, but rarely; 7d strikes a reasonable balance.
#
# Prefix is /proxy/archive/metadata/, not /proxy/archive/: the old form
# forwarded anything, including /proxy/archive/details/<id>, which is
# archive.org's full HTML item page (audit S03).
location ^~ /proxy/archive/metadata/ {
    if ($request_method !~ "^(?:GET|HEAD)$") { return 404; }
    if ($args) { return 404; }

    # One path segment, the item identifier captured by popups.js:884
    # from archive.org/details/([^/?#]+) and percent-encoded at
    # popups.js:887. archive.org identifiers are drawn from a restricted
    # alphabet; anything containing a slash (encoded or not) is rejected,
    # which is what confines this location to the metadata endpoint.
    if ($uri !~ "^/proxy/archive/metadata/[A-Za-z0-9][A-Za-z0-9._~()@+-]{0,149}$") { return 404; }

    set $upstream_archive archive.org;
    # Prefix-strip explicitly — see the arXiv block for why a URI part
    # on a variable proxy_pass would break this.
    rewrite ^/proxy/archive/(.*)$ /$1 break;
    proxy_pass https://$upstream_archive;
    proxy_set_header Host $upstream_archive;
    proxy_set_header User-Agent "levineuwirth.org popup-proxy (ln@levineuwirth.org)";

    # Upstream TLS verification — see the arXiv Atom block.
    proxy_ssl_server_name        on;
    proxy_ssl_name               $upstream_archive;
    proxy_ssl_verify             on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth       2;

    proxy_set_header Cookie        "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Robots-Tag;
    include snippets/security-headers.conf;
    include snippets/security-framing.conf;

    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_cache popup_proxy;
    proxy_cache_valid 200 7d;
    proxy_cache_valid any 5m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status always;

    add_header Access-Control-Allow-Origin "$scheme://$host" always;
}

# ── PubMed (NCBI E-utilities) ────────────────────────────────────────
# Article summaries. esummary.fcgi is the only E-utility popups.js calls
# (popups.js:911); efetch, esearch and the rest are NOT proxied.
#
# NCBI asks that automated clients identify themselves
# (https://www.ncbi.nlm.nih.gov/books/NBK25497/). This proxy does so
# through the User-Agent below; it does NOT inject tool=/email= query
# parameters — an earlier comment here claimed it did, which was never
# true of the configuration. Adding them would mean rewriting $args, and
# the argument allow-list below would have to move with it.
location = /proxy/pubmed/entrez/eutils/esummary.fcgi {
    if ($request_method !~ "^(?:GET|HEAD)$") { return 404; }

    # Exactly the query popups.js builds at popups.js:911-912, with the
    # PMID captured by its match regex (popups.js:908) as \d+.
    if ($args !~ "^db=pubmed&id=\d{1,9}&retmode=json$") { return 404; }

    set $upstream_pubmed eutils.ncbi.nlm.nih.gov;
    # Prefix-strip explicitly — see the arXiv block for why a URI part
    # on a variable proxy_pass would break this.
    rewrite ^/proxy/pubmed/(.*)$ /$1 break;
    proxy_pass https://$upstream_pubmed;
    proxy_set_header Host $upstream_pubmed;
    proxy_set_header User-Agent "levineuwirth.org popup-proxy (ln@levineuwirth.org)";

    # Upstream TLS verification — see the arXiv Atom block.
    proxy_ssl_server_name        on;
    proxy_ssl_name               $upstream_pubmed;
    proxy_ssl_verify             on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth       2;

    proxy_set_header Cookie        "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;

    # NCBI etiquette: rate-limit to <3 req/s without an API key. With
    # caching this is rarely exercised, but the burst guards a hot page.
    limit_req zone=pubmed burst=3 nodelay;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Robots-Tag;
    include snippets/security-headers.conf;
    include snippets/security-framing.conf;

    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_cache popup_proxy;
    proxy_cache_valid 200 30d;
    proxy_cache_valid any  5m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status always;

    add_header Access-Control-Allow-Origin "$scheme://$host" always;
}

# ── Everything else under /proxy/ ────────────────────────────────────
# Default deny. Longest-prefix matching means the four allow-listed
# locations above win for the shapes they cover; every other request in
# the tree — /proxy/archive/details/texts, /proxy/arxiv/, a new provider
# added to popups.js but not here — lands on this block and is refused.
# Adding a provider therefore requires an explicit edit to this file,
# which is the point.
location ^~ /proxy/ {
    include snippets/security-headers.conf;
    include snippets/security-framing.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 404;
}
