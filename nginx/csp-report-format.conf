# csp_report: the format nginx/csp-report.conf logs CSP violation reports in.
log_format csp_report escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"host":"$host","method":"$request_method","status":$status,'
    '"remote_addr":"$remote_addr","ua":"$http_user_agent",'
    '"referer":"$http_referer","report":"$request_body"}';
