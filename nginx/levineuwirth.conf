# levineuwirth.conf — the site's server blocks, as installed at
# /etc/nginx/sites-available/levineuwirth.org (symlinked into sites-enabled).
#
# This file is the source of truth for the live vhost. Until 2026-10-03 the
# repo held only an example, and the live file drifted from it: no HTTP/2,
# nginx's own 146-byte page for every missing path, /404.html answering 200,
# and no foo → foo.html (audit X5/W03/Y13). `make deploy` never touches it;
# nginx/README.md says how to install it and the files it depends on.
#
# http { } companions, in conf.d/: popup-proxy-cache.conf (the popup
# proxies' cache and PubMed zone), csp-report-format.conf and
# csp-report-zone.conf (the CSP collector's log format and rate limit).
# `nginx -t` fails without them.

server {
    listen 443 ssl;
    http2  on;
    listen [::]:443 ssl;

    server_name levineuwirth.org;
    root        /srv/http/levineuwirth.org;
    index       index.html;

    ssl_certificate     /etc/letsencrypt/live/levineuwirth.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/levineuwirth.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Order matters: security-headers first so add_header directives
    # propagate into the locations defined by the other snippets.
    # security-framing.conf carries the X-Frame-Options / frame-ancestors
    # pair that used to live inside security-headers.conf; it is separate
    # so that /pdfjs/ and /archive/, which legitimately frame same-origin
    # documents, can substitute one coherent policy instead of stacking a
    # second, conflicting header on top of DENY.
    include snippets/security-headers.conf;
    include snippets/security-framing.conf;

    # Collector for `report-uri /csp-report`.
    include snippets/csp-report.conf;

    include snippets/static-assets.conf;
    include snippets/popup-proxy.conf;
    # archive.conf must come *after* security-headers.conf — it declares
    # its own add_header inside `location ^~ /archive/`, which (per the
    # nginx add_header inheritance rules) would otherwise drop the
    # baseline headers within that subtree. The snippet re-includes
    # security-headers.conf inside its location to compensate.
    include snippets/archive.conf;

    # A directory without its slash is redirected to it ($uri/ does that),
    # because every page's links are relative and resolve against the
    # slash. Then foo → foo.html, so a hand-typed or shared /about works.
    # tools/check-site.py resolves links the same way; the two must agree,
    # or a link the gate passes 404s here (audit X5).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The site's own 404 page (the build emits _site/404.html, and check-site
    # fails if it is missing). `internal` keeps it reachable only through
    # error_page: otherwise /404.html is an ordinary document served with
    # 200, which search engines index and monitoring reads as "up". The
    # internal redirect keeps the 404 status. The page's links and
    # stylesheets are root-relative, so it renders at any URL.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# www → the apex, in one hop.
server {
    listen 443 ssl;
    http2  on;
    listen [::]:443 ssl;

    server_name www.levineuwirth.org;

    ssl_certificate     /etc/letsencrypt/live/levineuwirth.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/levineuwirth.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://levineuwirth.org$request_uri;
}

# HTTP → HTTPS. In a location rather than at server level, so that an ACME
# challenge location certbot adds during renewal is matched before it.
server {
    listen 80;
    listen [::]:80;
    server_name levineuwirth.org www.levineuwirth.org;
    location / {
        return 301 https://levineuwirth.org$request_uri;
    }
}
