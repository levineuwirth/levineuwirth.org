# popup-proxy http{}-context companions — consumed by
# snippets/popup-proxy.conf (see the repo's nginx/ directory for
# provenance and documentation).
proxy_cache_path /var/cache/nginx/popup-proxy levels=1:2 keys_zone=popup_proxy:16m max_size=512m inactive=60d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=pubmed:1m rate=3r/s;
