# http { } scope companion to nginx/anki-sync.conf — install as
# /etc/nginx/conf.d/anki-sync-zone.conf. One zone for the sync server's
# login endpoint only: five attempts a minute per address is generous for
# a person and hopeless for a guesser; nothing else is rate-limited,
# because a media sync is a burst of small requests.
limit_req_zone $binary_remote_addr zone=anki_login:1m rate=5r/m;
