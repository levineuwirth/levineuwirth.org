# sync.levineuwirth.org — CouchDB behind TLS, for Obsidian's Self-hosted
# LiveSync plugin (universum + apocrypha → iPad, no PDFs for now).
#
# Install: the port-80 server first (so the ACME challenge can be
# answered), `certbot certonly --nginx -d sync.levineuwirth.org`, then this
# whole file to /etc/nginx/sites-available/couchdb-sync.conf, symlinked
# into sites-enabled; `nginx -t && systemctl reload nginx`. The certificate
# paths are explicit so certbot never rewrites this file; its renewal
# timer renews the certificate in place.
#
# What differs from a website vhost, and why:
#   - LiveSync keeps a long-lived `_changes?feed=continuous` connection
#     open per vault for live sync, and an initial vault import is one
#     large `_bulk_docs` request — buffering either would mean nginx
#     waiting for the whole thing before CouchDB sees a byte, or the
#     client waiting for the whole reply before seeing one back.
#   - no `limit_req` zone: unlike the Anki sync server, CouchDB has no
#     single low-frequency credential-guessing endpoint to protect — every
#     request carries its own Basic-Auth check, and an ordinary sync is
#     itself a burst of many small authenticated requests, so a request
#     ceiling that would catch a guesser would also catch a real sync mid
#     conflict resolution. Each vault's own CouchDB user, scoped to its one
#     database (see couchdb/docker-compose.yml), is the actual control.
#   - none of the website's CSP / framing headers: this is an API, not a
#     page the phone renders.
#   - Fauxton (CouchDB's own web admin UI, /_utils) is never exposed here.
#     require_valid_user in couchdb/local.ini means it cannot show anything
#     without login either way, but there is no reason to advertise a
#     CouchDB admin login page to the internet. Reach it over SSH instead:
#     `ssh -L 5984:127.0.0.1:5984 <vps>`, then http://127.0.0.1:5984/_utils/
#     from the laptop.

server {
    listen 80;
    listen [::]:80;
    server_name sync.levineuwirth.org;
    access_log /var/log/nginx/couchdb-sync.access.json.log access_json buffer=64k flush=5s;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name sync.levineuwirth.org;
    access_log /var/log/nginx/couchdb-sync.access.json.log access_json buffer=64k flush=5s;

    ssl_certificate     /etc/letsencrypt/live/sync.levineuwirth.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.levineuwirth.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    error_log  /var/log/nginx/couchdb-sync.error.log;

    client_max_body_size 50m;       # matches max_document_size in couchdb/local.ini
    proxy_request_buffering off;    # a vault's first push is one big _bulk_docs body
    proxy_buffering off;            # a live vault's _changes feed is a long-lived stream
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location ^~ /_utils {
        return 403;
    }

    location / {
        # The updater keeps clients out until the candidate or rollback is
        # verified. Keep this marker on interrupted/failed recovery too.
        open_file_cache off;
        if (-f /var/lib/couchdb-update/maintenance) { return 503; }
        proxy_pass http://127.0.0.1:5984;
    }
}
