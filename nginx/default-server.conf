# default-server.conf — what answers a request for a hostname this VPS does
# not serve. Installed at /etc/nginx/sites-available/default-server.conf,
# symlinked into sites-enabled.
#
# Without it, the default for a port is the first server that listens on
# it, which was anki-sync.conf's (sites-enabled is read in name order): a
# request with an unknown or no hostname on :443 got the Anki certificate
# and reached the Anki backend, and on :80 a 301 to https:// on whatever
# Host it had sent (audit W05). Here :80 closes the connection without an
# answer, and :443 refuses the TLS handshake before any certificate is
# shown. A scanner addressing the bare IP learns nothing about the names
# behind it.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return      444;
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
