# nginx.conf — the VPS's /etc/nginx/nginx.conf.
#
# Process-wide settings and the http { } defaults every server shares; the
# servers themselves are in sites-enabled/, and http { } companions in
# conf.d/. Replaces the stock Arch file, which also defined a "localhost"
# server on :80 and, until 2026-10-03, carried the forge's server block
# inline (now forgejo.conf). nginx/README.md has the steps.

worker_processes 1;

# The brotli filter and static modules (modules.d/20-brotli.conf).
include modules.d/*.conf;

events {
    worker_connections 1024;
}

http {
    types_hash_max_size 4096;
    include      mime.types;
    default_type application/octet-stream;

    sendfile          on;
    keepalive_timeout 65;

    # No version in the Server header or on nginx's error pages, for every
    # server. It was set only inside the site's own server block, so :80
    # and the www., git., anki. and sync. servers all sent nginx/1.30.5
    # (audit W05).
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
