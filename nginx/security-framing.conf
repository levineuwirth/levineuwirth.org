# security-framing.conf — framing (clickjacking) policy, split out of
# security-headers.conf.
#
# Why a separate snippet: two locations on this site legitimately frame
# a same-origin document — the PDF.js viewer embedded by
# build/Filters/EmbedPdf.hs (`location ^~ /pdfjs/` in static-assets.conf)
# and the sandboxed link-archive snapshot embedded by templates/archive.html
# (`location ^~ /archive/` in archive.conf). Both were being refused by
# the site-wide `X-Frame-Options: DENY` (audit S07).
#
# nginx's add_header chain is replaced wholesale, not merged, as soon as
# a location declares any add_header of its own. So a location that
# wants a different framing rule cannot "unset" DENY — it can only avoid
# emitting it. Keeping the framing directives in their own snippet lets
# such a location re-include the rest of the baseline
# (security-headers.conf) while substituting ONE coherent framing policy
# instead of layering a second, conflicting header on top of the first.
#
# Include this once at server { } level, immediately after
# security-headers.conf:
#
#   server {
#       include snippets/security-headers.conf;
#       include snippets/security-framing.conf;
#       ...
#   }
#
# Any location that declares its own add_header directives must re-include
# BOTH snippets — except the two framing-exception locations named above,
# which re-include security-headers.conf only and declare their own
# SAMEORIGIN / frame-ancestors 'self' pair.

# Legacy framing control. Honoured by every current browser; kept because
# it is the only framing control that is actually *enforced* today (the
# main policy below is still Report-Only, see security-headers.conf).
add_header X-Frame-Options "DENY" always;

# Modern framing control. Deliberately ENFORCING even while the main
# policy is Report-Only: `frame-ancestors` in a Report-Only policy is
# reported but never enforced, so shipping it report-only would be a
# no-op that merely duplicates the header above. A policy that contains
# only `frame-ancestors` restricts nothing else — there is no default-src
# fallback for it — so this is safe to enforce on its own.
#
# Emitted as a second Content-Security-Policy header. Per CSP Level 3
# §"Multiple policies", every policy in the response is enforced
# independently and the effective result is their intersection, so this
# does not weaken or conflict with the Report-Only policy next to it.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
