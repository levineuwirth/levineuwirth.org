# csp-report.conf — collector for the `report-uri /csp-report` destination
# named by the Content-Security-Policy-Report-Only header in
# security-headers.conf.
#
# Audit S05: the policy was Report-Only with no reporting destination, so
# it produced no operational signal — only console noise on whatever
# browser happened to load the page. This snippet gives it somewhere to
# report to, using nothing but nginx, so no extra service has to be run
# or kept patched.
#
# Include ONCE at server { } level (it defines top-level locations, so it
# must not be included from inside another location):
#
#   server {
#       include snippets/security-headers.conf;
#       include snippets/security-framing.conf;
#       include snippets/csp-report.conf;
#       ...
#   }
#
# ── http { } scope ──────────────────────────────────────────────────
# The log format must be defined in http { } (nginx.conf or a conf.d/
# file). $request_body carries the report JSON:
#
#   log_format csp_report escape=json
#       '{"time":"$time_iso8601","ua":"$http_user_agent",'
#       '"referer":"$http_referer","report":"$request_body"}';
#
# $request_body is quoted as a JSON *string*, not spliced in as raw JSON:
# with escape=json nginx escapes the value, so an unquoted $request_body
# produces `"report":{\"a\":1}` — not parseable, and a hostile body could
# otherwise break the line. Read a report back with
# `jq -r .report <line> | jq .`.
#
# Rotate it like any other access log; the reports are low volume and
# contain no visitor-supplied text beyond URLs the browser was already
# loading.
#
# `nginx -t` FAILS with "unknown log format" if that log_format is not
# defined before this snippet is included. If you would rather not add
# it, simply do not include this file and drop `report-uri /csp-report`
# from security-headers.conf; nothing else depends on either.

location = /csp-report {
    # Reports are POSTed. Anything else is not a report.
    if ($request_method != POST) { return 405; }

    # Reports are a few hundred bytes. Cap hard and keep the body in
    # memory: $request_body is only populated for a buffered, in-memory
    # body — once nginx spills it to a temp file the variable is empty.
    client_max_body_size    16k;
    client_body_buffer_size 16k;

    access_log /var/log/nginx/csp-report.log csp_report;

    # nginx only reads the request body for requests it forwards, so a
    # bare `return 204;` here would log an empty $request_body. Proxying
    # to a black hole forces the read: with proxy_request_buffering on
    # (the default) nginx buffers the whole body BEFORE it opens the
    # upstream connection, then the connection to the discard port is
    # refused immediately and error_page turns that failure into the
    # 204 the browser expects. No packet ever leaves the host.
    #
    # 127.0.0.1:9 is the RFC 863 discard port and nothing listens on it.
    # If a real collector is ever run, point proxy_pass at it and delete
    # the error_page line.
    proxy_pass              http://127.0.0.1:9;
    proxy_connect_timeout   1s;
    proxy_intercept_errors  off;
    error_page 502 504 = @csp_report_ok;

    # Never let a report be cached, indexed, or answered from a proxy.
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag  "noindex, nofollow" always;
}

location @csp_report_ok {
    # The access_log MUST be repeated here. After the error_page redirect
    # above, the request ends in THIS location, and nginx writes the
    # access log from the configuration of the location it ends in —
    # with the directive only on /csp-report, $request_body logs empty.
    # (Verified: same request, same log_format; the field is populated
    # only when this line is present.)
    access_log /var/log/nginx/csp-report.log csp_report;

    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag  "noindex, nofollow" always;
    return 204;
}
