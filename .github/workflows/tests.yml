# The tests that need nothing but Python, Node and stock tools; engine/tests/ci.py
# lists them and fails if any skips. The full suite (`make test`, which every
# deploy runs, and `make test-clean`) needs the Haskell generator and a built
# site, and runs on the author's machine.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Everything else engine/tests/ci.py needs (node, gpg, rsync, flock, coreutils)
      # ships with the runner; borg does not. Ubuntu's 1.2.8 passes the test.
      - name: borg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends borgbackup
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The engine's Python project, synced into the site's .venv (`make
      # venv`); absolute, as uv resolves a relative path against engine/.
      - name: Python environment (engine/uv.lock)
        run: uv sync --frozen --project engine
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      - name: Tests
        run: .venv/bin/python engine/tests/ci.py
